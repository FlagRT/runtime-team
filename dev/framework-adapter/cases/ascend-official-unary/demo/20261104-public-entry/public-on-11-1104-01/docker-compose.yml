    - ${FLAGRT_DEPS:?required}:/deps:ro
    - ${FLAGRT_RUNTIME:?required}:/runtime:ro
    - ${FLAGRT_OUTPUT:?required}:/results
    - ${FLAGRT_RECORDS:?required}:/records:ro
    - ${FLAGRT_MODEL:?required}:/model:ro
    - /usr/local/Ascend/driver:/usr/local/Ascend/driver:ro
    - /home/cgu135/framework-public-entry-20261104/input/flagrt_framework_adapter-0.3.0.dev3-py3-none-any.whl:/package/flagrt_framework_adapter-0.3.0.dev3-py3-none-any.whl:ro
    - /home/cgu135/framework-public-entry-20261104/review-public-20261104:/config:ro
    environment:
      PYTHONDONTWRITEBYTECODE: '1'
      HF_HUB_OFFLINE: '1'
      TRANSFORMERS_OFFLINE: '1'
      ASCEND_RT_VISIBLE_DEVICES: 0,1
      FLAGRT_VERIFIED_IMAGE_ID: sha256:2e56022ae5b39930e6df12cbd69cece9156adf2a2a1136952f87c1ef0960315f
      DC_ROOT: /runtime
      DC_BACKEND: ascend
      DC_DIST_BT: hccl
      DC_MODEL: /model
      DC_OUT_DIR: /results/train
      MAX_STEPS: '3'
      BATCH: '1'
      SEQ: '32'
      LR: 1e-5
    command:
    - sleep
    - infinity
    restart: 'no'
    ipc: host
    ulimits:
      memlock: -1
