# =====================================================================
# 运行时层 · 平头哥 PPU（真武 ZW810E）统一基座 —— 锁定镜像与基座规范（首次建立）
# 文件：dev/stack.lock.thead-ppu.v1.yaml
# 效力：本文件是全组（平头哥 PPU 线）结论性验证的唯一环境依据；任何变更需更新本文件并知会全组
# 起草：runtime-team 总组 ｜ 结构参照 dev/stack.lock.kunlunxin.v1.yaml，内容按 PPU 实情如实分叉
# 记录：2026-10-15 ｜ 定稿：2026-10-15 ｜ 状态：生效
# 版本化规范见战略文档 §8（影响已锁定承诺的变更 → 新建版本号文件，旧文件开头加 LEGACY 说明）
#
# 本文件为平头哥 PPU 首份锁定声明（版本化规范：影响已锁定承诺的变更 → 原地改 lock: 并记 changelog）。
# 现行生效 = thead-ppu-runtime v2（官方基座 + 固化 triton/flagtree 的一层派生；2026-10-29 总组
# 裁定切生效，指挥台 ADR-0011）：基座字节不动（Harbor digest 锚仍可拉），其上加恰一个
# flagtree wheel（sha256 在案）固化 triton + flagtree，修掉 vLLM 服务化前置门控对 triton 的
# 镜像外隐性依赖。
# v1 = v2 的基座层（非废弃，可按 digest 拉取）；v2 血统/证据/重建配方见 dev/images/thead-ppu-runtime/v2/。
# 派生层纪律（ADR-0011 例外授权边界）：官方基座之上、只做加法、恰一层、wheel 内容寻址、
# 经本文件 candidates 登记并提请总组裁定后生效；方向不得自行切 lock。当前无在途候选。
# =====================================================================

version: 1
recorded_at: "2026-10-15"
updated_at: "2026-10-29"
owner: 总组
chip: "平头哥 PPU（真武 ZW810E）"
acceptance_model: "Qwen/Qwen3-Embedding-0.6B（与 P800 同款基准模型；模型资产在 PTG_0 /bmcp_lvm_fs/hliu553/models/）"
flagtree_line: |
  ppu3.6（PPU SDK v2.1.0 / py3.12 / torch 2.10.0 / vLLM 0.19.0+cu130）。锁定镜像 =
  thead-ppu-runtime v2 派生镜像：基座 = BAAI·FlagTree 官方构建物（harbor.baai.ac.cn/flagtree，
  digest 锚、字节不动），其上加恰一层本组派生（一个 flagtree wheel 经 pip 离线固化，
  同时提供 triton 3.6.0 + flagtree，wheel sha256 b57daff7…），配方在仓内
  dev/images/thead-ppu-runtime/v2/Dockerfile.repro。本组 PPU 后端（runtime ppu 0.1.0）
  不在镜像内，在仓内 dev/device-context/prototype/runtime/，经 WORKSPACE_ROOT 挂载使用。
  版本事实（image id、wheel sha256、内置组件版本）以
  dev/images/thead-ppu-runtime/v2/image.baseline.yaml 为准。

# ---------------------------------------------------------------
# 设备注册路线（与 P800 同型：无带卡容器独占；与昇腾相反，勿照抄昇腾纪律）
# ---------------------------------------------------------------
device_registration:
  primary: "Route A（厂商官方栈：FlagTree 官方镜像自带 PPU SDK v2.1.0 + CUDA wrapper cu130；PPU 设备 API 走 torch.cuda 命名空间，torch.xpu.device_count()==0）"
  selection: |
    无带卡容器独占（同 P800、与昇腾相反）：多容器可并存，docker ps 只是共享机礼貌；
    用 ppu-smi 挑 0% 利用率 / 2MiB 显存的空闲卡，以 CUDA_VISIBLE_DEVICES=<物理卡号>
    自律（demo 映射全部 16 卡使容器内逻辑号 == 宿主物理号；自建环境只授予卡子集时
    须写重编号后的逻辑号——该变量按授予顺序密集重编号，同 P800）。
    设备授予：声明式 devices: /dev/alixpu + /dev/alixpu_ctl（缺 ctl 则设备枚举失效）
    + 所用 alixpu_ppuN；不需要 --privileged，不需要挂宿主驱动（PPU SDK 在镜像内）。
    本机两条实测启动坑（demo 已内置规避，详见该目录文件头）：
    ① --network host 下宿主主机名（ai-server）不在 DNS → torchrun/c10d 静默挂 300s，
       须 --add-host=ai-server:127.0.0.1；
    ② 镜像写死 NCCL_SOCKET_IFNAME=eth0 而本机真网卡是 bond0 → 须覆盖为 bond0。

# ---------------------------------------------------------------
# 锁定镜像（训练/推理同底座：官方基座 + 本组派生层）
# ---------------------------------------------------------------
lock:
  runtime:                              # 训练（transformers DDP）与推理（镜像自带 vllm 0.19.0+cu130）同底座
    image: "flagrt/thead-ppu-runtime:1.0.0-ppu3.6-py312-torch2.10.0-flagtree0.7.0-triton3.6.0-x86_64"
    notes: "thead-ppu-runtime v2 派生镜像（官方基座 + 单 wheel 派生层；2026-10-29 总组裁定生效，指挥台 ADR-0011）：triton 3.6.0 + flagtree 固化在镜像内，vLLM 服务化前置门控（find_spec triton）直接满足；无镜像缺陷级已知限制；两条启动坑（hostname / NCCL 网卡）为环境事实非镜像缺陷，env/v1 已内置规避。版本事实以 dev/images/thead-ppu-runtime/v2/image.baseline.yaml 为准"
    container_name: "flagrt-ppu-v2-env-v1-ptg0（运行环境容器：dev/images/thead-ppu-runtime/v2/env/v1/）"
    base_image_entry: "dev/images/thead-ppu-runtime/v2"          # 血统 / 内置版本 / 重建指针 / 登记证据（v1 条目 = 其基座层，digest 可拉）
    registry_status: "本机构建、未 push（RepoDigests 空）⇒ 分发 = 离线包（dev/images/thead-ppu-runtime/v2/ARCHIVE.md，17.15 GiB，sha256/pigz/docker load 三重核验）+ 仓内配方重建（Dockerfile.repro + build.sh）；跨机 image id 不同属预期，版本锚 = image_id + wheel sha256。基座层可按 Harbor digest 拉取（sha256:50a906e6…）。image id：sha256:1ba7ead15378160ba9aa1dafcfb77686de6b16732590ffab062bab19c60c32b8（PTG_0 本机 docker inspect 实测）｜ repro_status 🟢 functional-repro（末轮构建产物即交付镜像）"

# ---------------------------------------------------------------
# 候选血统（当前无在途候选。流程：方向按入档门槛入 dev/images/<name>/vN/ 后在此登记候选，
# 总组裁定切生效 ⇒ 改 lock: 并收口本段、记 changelog——v2 为该流程首例完整走通，见 ADR-0011）
# ---------------------------------------------------------------
candidates: {}

# ---------------------------------------------------------------
# 使用规则（按 PPU 实情；PPU 特有纪律置于最前）
# ---------------------------------------------------------------
rules:
  - "--network host 启动必须带 --add-host=ai-server:127.0.0.1（否则 torchrun/c10d 静默挂 300s 后超时；mp.spawn + tcp://127.0.0.1 不受影响）"
  - "必须覆盖 NCCL_SOCKET_IFNAME=bond0（镜像写死 eth0，本机无 eth0；不覆盖则 nccl all_reduce 失败 Bootstrap: no socket interface found）"
  - "结论性验证只在锁定镜像内做；日常调试容器结果不作为验收依据"
  - "任何镜像变更必须更新本文件并知会全组"
  - |
    共享机纪律（PTG_0，同 P800 型）：无带卡容器独占，但绝不 stop/rm 他人容器（本机
    25+ 容器常在跑，基座镜像被 5 个工作负载容器共用）；选卡纪律见
    device_registration.selection；根分区 100% 满（2026-10-29 实测，勿写入、git 写操作前先 df）、
    /data 99%（勿写入），docker 与大文件落 /bmcp_lvm_fs（11T，剩 628G）。
  - |
    基座镜像入锁门槛（沿用既有口径）：任何镜像进入本文件 lock: 前，
    dev/images/<name>/v<N>/ 必须存在且含 lock.yaml，repro_status ≥ 🟡；
    上游发布的镜像可无 Dockerfile 但须有可拉取 digest。规范见 dev/images/README.md。
    统一基座的确定/调整/发布由总组裁定；各方向只消费不自建，诉求写进本方向
    STATUS.md 由总组收拢。

# ---------------------------------------------------------------
# 已知限制（本镜像自身无；平台侧缺陷归 device-context 方向跟踪）
# ---------------------------------------------------------------
known_issues: []
# 说明：PPU 侧已定位的平台缺陷（退出期弱引用悬垂 SIGSEGV，根因在平台侧 Py_FinalizeEx→
# _PyWeakref_ClearRef，本层已规避、不影响正常结论；转厂商跟进）由 device-context 方向
# 在其目录内跟踪；属运行时层职责外的平台事实，不入本清单。
# 镜像使用注意（pip show triton 无输出 ⇒ 勿用 pip show 判装没装；flagtree.__version__ 自报
# 3.6.0 跟随 triton 线号 ⇒ 版本锚一律用 wheel 文件名/dist-info + sha256；image.baseline 为
# ADR-0007 登记式）登记于 dev/images/thead-ppu-runtime/v2/lock.yaml 的 known_issues 与 gaps。

