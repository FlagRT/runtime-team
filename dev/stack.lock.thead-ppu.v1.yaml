version: 1
recorded_at: "2026-10-15"
updated_at: "2026-10-27"
owner: 总组
chip: "平头哥 PPU（真武 ZW810E）"
acceptance_model: "Qwen/Qwen3-Embedding-0.6B（与 P800 同款基准模型；模型资产在 PTG_0 /bmcp_lvm_fs/hliu553/models/）"
flagtree_line: |
  ppu3.6（PPU SDK v2.1.0 / py3.12 / torch 2.10.0 / vLLM 0.19.0+cu130）。锁定镜像为
  BAAI·FlagTree 官方构建物（harbor.baai.ac.cn/flagtree），非本组构建、无仓内配方，
  版本锚 = Harbor digest（公开可拉）。本组 PPU 后端（runtime ppu 0.1.0）不在镜像内，
  在仓内 dev/device-context/prototype/runtime/，经 WORKSPACE_ROOT 挂载使用。
  版本事实（image id、内置组件版本）以
  dev/images/thead-ppu-runtime/v1/image.baseline.yaml 为准。

# ---------------------------------------------------------------
# 设备注册路线（与 P800 同型：无带卡容器独占；与昇腾相反，勿照抄昇腾纪律）
# ---------------------------------------------------------------
device_registration:
  primary: "Route A（厂商官方栈：FlagTree 官方镜像自带 PPU SDK v2.1.0 + CUDA wrapper cu130；PPU 设备 API 走 torch.cuda 命名空间，torch.xpu.device_count()==0）"
  selection: |
    无带卡容器独占（同 P800、与昇腾相反）：多容器可并存，docker ps 只是共享机礼貌；
    用 ppu-smi 挑 0% 利用率 / 2MiB 显存的空闲卡，以 CUDA_VISIBLE_DEVICES=<物理卡号>
    自律（demo 映射全部 16 卡使容器内逻辑号 == 宿主物理号；自建环境只授予卡子集时
    须写重编号后的逻辑号——该变量按授予顺序密集重编号，同 P800）。
    设备授予：声明式 devices: /dev/alixpu + /dev/alixpu_ctl（缺 ctl 则设备枚举失效）
    + 所用 alixpu_ppuN；不需要 --privileged，不需要挂宿主驱动（PPU SDK 在镜像内）。
    本机两条实测启动坑（demo 已内置规避，详见该目录文件头）：
    ① --network host 下宿主主机名（ai-server）不在 DNS → torchrun/c10d 静默挂 300s，
       须 --add-host=ai-server:127.0.0.1；
    ② 镜像写死 NCCL_SOCKET_IFNAME=eth0 而本机真网卡是 bond0 → 须覆盖为 bond0。

# ---------------------------------------------------------------
# 锁定镜像（FlagTree 官方基座，训练/推理同底座）
# ---------------------------------------------------------------
lock:
  runtime:                              # 训练（transformers DDP）与推理（镜像自带 vllm 0.19.0+cu130）同底座
    image: "flagtree-ppu-py312-torch2.10.0-sdk2.1.0-cu130-ubuntu24.04:202607-3.6-base"
    notes: "BAAI·FlagTree 官方基座镜像（登记式基线，ADR-0007）：无已知镜像限制；两条启动坑（hostname / NCCL 网卡）为环境事实非镜像缺陷，demo 已内置规避。版本事实以 dev/images/thead-ppu-runtime/v1/image.baseline.yaml 为准"
    container_name: "flagrt-ppu-v1-demo-ptg0（demo 运行环境容器：dev/images/thead-ppu-runtime/v1/demo/）"
    base_image_entry: "dev/images/thead-ppu-runtime/v1"          # 血统 / 内置版本 / 重建指针 / 登记证据
    registry_status: "公开 Harbor registry（harbor.baai.ac.cn/flagtree），digest 锁定可拉。image id：sha256:f5366712d6a0856a429f9df3503bc377c929df806acc654973e350e27fed9239（PTG_0 本机 docker inspect 实测）｜ repro_status 🟢 FlagTree 官方镜像（镜像不可重建是设计边界，官方产物）"

# ---------------------------------------------------------------
# 候选血统（2026-10-27 起在途 1 项；lock: 仍未改，生效切换待总组裁定）
# ---------------------------------------------------------------
candidates:
  thead-ppu-runtime-v2:
    image: "flagrt/thead-ppu-runtime:1.0.0-ppu3.6-py312-torch2.10.0-flagtree0.7.0-triton3.6.0-x86_64"
    image_id: "sha256:1ba7ead15378160ba9aa1dafcfb77686de6b16732590ffab062bab19c60c32b8"
    size_bytes: 41745259535          # 41.75 GB = 基座 40.3 + 派生层 ≈1.4
    entry: "dev/images/thead-ppu-runtime/v2"          # 入档门槛已满足：lock.yaml + image.baseline.yaml + 🟢 functional-repro
    relation_to_lock: >-
      在 lock.runtime.image（v1 官方基座）**之上加一层**派生；基座字节未变、不重建基座。
      派生层 = 一个 flagtree wheel（sha256 b57daff7…）经 `pip install --no-index --no-deps` 固化，
      同时提供 triton + flagtree。
    why: >-
      官方基座**不含 triton**，而 vLLM 起服务前门控 `find_spec("flash_attn") and find_spec("triton")`
      ⇒ 服务化腿必然起不来。此前靠手工 `docker cp` 从共享目录补三件，**容器重建即丢**，且属镜像外
      隐性依赖（违反 ENV-SPEC「外部依赖须声明」）。v2 把它变成镜像内事实。
    evidence: >-
      全新容器（零手工干预）：`TRITON_PPU_SMOKE_PASS`（真编 kernel，耗时 1.37–1.50 s，最大误差
      0.000e+00，边界 n=3000 一致）· `SERVE_STANDARD_PASS (ready=1 smoke=1)` · `find_spec('triton')=True`
      · 现役容器切 v2 后 `s03 PASS` + `s06 CONTRACT_INVARIANTS_PASS 4/4`(rc=0) ·
      基线 `baseline.py check` PASS(rc=0)。证据：dev/images/thead-ppu-runtime/v2/assets/evidence/
    status: >-
      已入档、**未切生效**（lock: 仍指 v1）；device-context 方向在 PTG_0 的运行容器已改用 v2。
      离线归档已产出（dev/images/thead-ppu-runtime/v2/ARCHIVE.md）。
    needs_decision: >-
      ① 是否把 v2 切为该芯片生效版本（切则改本文件 lock.runtime.image + base_image_entry，
      image_list「当前生效版本」表随之更新）；
      ② 本文件 rules 有一条「统一基座的确定/调整/发布由总组裁定；各方向只消费不自建」——
      **本候选恰是本方向自建的派生层**，属该条需要总组例外授权的情形；替代路径是 TODO #23
      （把 triton 上提官方基座线，届时 v2 整体废弃、不再产生 v3）。
    blockers: "无技术阻塞（入档门槛已满足）；待总组对上面 ①② 表态" 

# ---------------------------------------------------------------
# 使用规则（按 PPU 实情；PPU 特有纪律置于最前）
# ---------------------------------------------------------------
rules:
  - "--network host 启动必须带 --add-host=ai-server:127.0.0.1（否则 torchrun/c10d 静默挂 300s 后超时；mp.spawn + tcp://127.0.0.1 不受影响）"
  - "必须覆盖 NCCL_SOCKET_IFNAME=bond0（镜像写死 eth0，本机无 eth0；不覆盖则 nccl all_reduce 失败 Bootstrap: no socket interface found）"
  - "结论性验证只在锁定镜像内做；日常调试容器结果不作为验收依据"
  - "任何镜像变更必须更新本文件并知会全组"
  - |
    共享机纪律（PTG_0，同 P800 型）：无带卡容器独占，但绝不 stop/rm 他人容器（本机
    25+ 容器常在跑，基座镜像被 5 个工作负载容器共用）；选卡纪律见
    device_registration.selection；根分区 94% / /data 99%（勿写入），docker 与大文件
    落 /bmcp_lvm_fs（11T，剩 2.1T）。
  - |
    基座镜像入锁门槛（沿用既有口径）：任何镜像进入本文件 lock: 前，
    dev/images/<name>/v<N>/ 必须存在且含 lock.yaml，repro_status ≥ 🟡；
    上游发布的镜像可无 Dockerfile 但须有可拉取 digest。规范见 dev/images/README.md。
    统一基座的确定/调整/发布由总组裁定；各方向只消费不自建，诉求写进本方向
    STATUS.md 由总组收拢。

