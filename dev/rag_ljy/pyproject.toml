[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagos-rag-ljy"
version = "0.1.0"
description = "Selectable Elasticsearch/Milvus RAG pipeline with Qwen3 models on Ascend NPU"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.0,<10",
  "huggingface-hub>=0.30,<2",
  "pymilvus>=3.0,<4",
  "python-dotenv>=1.0,<2",
  "transformers>=4.51,<6",
]

[project.optional-dependencies]
test = ["pytest>=8,<9", "httpx>=0.27,<1", "fastapi>=0.115,<1", "pydantic>=2,<3"]
serve = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2,<3"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
