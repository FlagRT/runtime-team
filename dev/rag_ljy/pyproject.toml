[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "flagos-rag-ljy"
version = "0.1.0"
description = "Selectable Elasticsearch/Milvus RAG pipeline with Qwen3 models on Ascend NPU"
requires-python = ">=3.11"
dependencies = [
  "elasticsearch>=9.0,<10",
  "huggingface-hub>=0.30,<1",
  "pymilvus>=3.0,<4",
  "python-dotenv>=1.0,<2",
  "transformers>=4.51,<5",
]

[project.optional-dependencies]
test = ["pytest>=8,<9"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
