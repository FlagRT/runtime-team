# Standalone CPU-only Milvus for RAG dense-vector search.
# Run from dev/rag_ljy:
# docker compose --env-file .env -f docker_compose/compose.milvus.yml up -d

name: flagos-rag-ljy-milvus

services:
  etcd:
    # Match the embedded etcd version previously used by Milvus 3.0.0.
    image: quay.io/coreos/etcd:v3.5.23
    container_name: rag-ljy-milvus-etcd
    command:
      - etcd
      - --name=default
      - --data-dir=/etcd
      - --listen-client-urls=http://0.0.0.0:2379
      - --advertise-client-urls=http://etcd:2379
      - --listen-peer-urls=http://127.0.0.1:2380
      - --initial-advertise-peer-urls=http://localhost:2380
      - --initial-cluster=default=http://localhost:2380
      - --auto-compaction-mode=revision
      - --auto-compaction-retention=1000
      - --quota-backend-bytes=4294967296
    volumes:
      # Reuse existing metadata; never run embedded etcd against this concurrently.
      - ${MILVUS_DATA_DIR:-/mnt/raid/jliu171/milvus-data}/etcd:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "--endpoints=http://127.0.0.1:2379", "endpoint", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 10s
    stop_grace_period: 60s
    restart: "on-failure:3"

  milvus:
    image: milvusdb/milvus:${MILVUS_VERSION:-v3.0.0}
    container_name: rag-ljy-milvus
    command: ["milvus", "run", "standalone"]
    security_opt:
      - seccomp:unconfined
    environment:
      ETCD_USE_EMBED: "false"
      ETCD_ENDPOINTS: etcd:2379
      ETCD_AUTH_ENABLED: "false"
      COMMON_STORAGETYPE: local
      DEPLOY_MODE: STANDALONE
    depends_on:
      etcd:
        condition: service_healthy
    configs:
      - source: milvus_user
        target: /milvus/configs/user.yaml
    ports:
      - 127.0.0.1:${MILVUS_PORT:-19530}:19530
      - 127.0.0.1:${MILVUS_WEB_PORT:-9091}:9091
    volumes:
      - ${MILVUS_DATA_DIR:-/mnt/raid/jliu171/milvus-data}:/var/lib/milvus
    mem_limit: ${MILVUS_MEMORY_LIMIT:-16g}
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9091/healthz"]
      interval: 30s
      timeout: 20s
      retries: 3
      start_period: 90s
    stop_grace_period: 60s
    restart: "on-failure:3"

configs:
  milvus_user:
    content: |
      # Bypass incomplete optional JSON shredding artifacts; use original JSON.
      common:
        enabledJSONShredding: false
        usingJSONShreddingForQuery: false
