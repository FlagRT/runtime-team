# 分布式运行时（distribution_ljy）子方向开发容器（公共资源配置见 ../compose.base.yml，本文件只含子方向专属）
# 用法：cd dev/distribution_ljy && docker compose -f ../compose.base.yml -f docker-compose.yml up -d
# 注意：-f 多文件合并（后文件覆盖前文件），需 docker compose v2；DrvMng 并发容器上限≈3；
#       多卡测试前 npu-smi 确认 16 卡空闲；容器名冲突时先 docker stop 旧容器

services:
  runtime-dev:
    container_name: flagos-distribution_ljy-dev-910c
    environment:
      # 子方向专属环境变量（与 .env.example 对应，.env 中可覆盖默认值）
      # - YOUR_SWITCH=${YOUR_SWITCH:-true}
    restart: "no"
    # 注意：容器内实验 venv 不在挂载盘上，容器重建会丢失；重建步骤记入本子方向 README
