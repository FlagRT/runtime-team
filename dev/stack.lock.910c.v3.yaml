# ---------------------------------------------------------------
# 设备注册路线（全组原则）
# ---------------------------------------------------------------
device_registration:
  primary: "Route A（各芯片厂商官方设备插件；昇腾 = 华为昇腾官方 torch_npu）"
  note: |
    v3 起训练腿回归 Route A 默认，不再有例外段：torch_npu autoload 抢注
    PrivateUse1="npu"，集合通信走 FlagCX 注册的原生 "flagcx" c10d 后端；
    torch_fl 仍在镜像内但降为 opt-in（须显式 TORCH_DEVICE_BACKEND_AUTOLOAD=0
    且在 torch_npu 抢注之前手动 import torch_fl），见
    dev/images/ascend-operator-runtime/v3/lock.yaml 的 torch_npu_default_finding。
    v2 的「训练腿因锁定镜像环境约束使用 flagos（torch_fl）例外」段落随 v2 文件
    一并标 LEGACY，不再是现行口径。

