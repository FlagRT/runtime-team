    image: "flagrt/ascend-operator-runtime-comm:2.0.0-flagtree3.5-routeA-cann9.0-py311-torch2.10-flagcx0.13.0g4e0e0cb-arm64"
    notes: "与 lock.train 同一镜像（v3 完整镜像 = 推理+训练超集）。v3 起推理腿不再单用华为昇腾官方 vllm-ascend 镜像，两腿收敛到同一基座，使用方无需按场景选镜像。推理环境同样受 A-1（shmem 缺失）约束，须落实 demo 的三项规避配置（见 docs/基座发版说明-20261014.md）"
