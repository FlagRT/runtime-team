# ---------------------------------------------------------------
# 使用规则（第 1 条为最高优先级，实测取证，出现事故先查它）
# ---------------------------------------------------------------
rules:
  - |
    【最高优先级 · 2026-10-14 修订】一台机器同时只跑一个带卡容器。
    机制：容器默认挂满 16 张 davinci 设备（compose 的 devices: 整值给出），设备级独占，
    因此第二个带卡容器一律 EBUSY —— 这是真实的硬约束。
    → 需要同时做多项验证时：**共用一个容器**，以 ASCEND_RT_VISIBLE_DEVICES 分区，
      把不同验证绑到不同的卡上（设备模型与实测证据见 dev/issues/README.md「共享机器」节）。
    → 两条腿（训练/推理）串行执行即可：跑完一条停掉再起下一条。v3 两腿同镜像同容器，
      本身就以分区方式共用。
    → 出现 acl.init() 返回 500000（ACL_ERROR_INTERNAL_ERROR）、伴随
      DrvMngGetConsoleLogLevel failed(ret=4) / path string is NULL、
      torch.npu.device_count()=0（设备"凭空消失"）时，第一时间核查带卡容器数与设备占用，
      不要先怀疑镜像、驱动或代码。
    ⚠️ 历史口径澄清（三个数为什么不一样）：本条 2026-09-08 原写「并发上限 3」（观测 4 个
      并发时 acl.init()=500000，降到 3 个后恢复），另有实测「上限 2」（-8020 device is used）
      的记录，而 dev/issues/README.md 记带卡容器独占（= 1）。三者的差异来自两件事被混为一谈：
      ① 设备级独占（挂满 16 设备 ⇒ 只能 1 个容器）；② 驱动 DrvMng 名额（历史观测 2~3）。
      当前操作口径 =「1 个带卡容器 + 容器内用 ASCEND_RT_VISIBLE_DEVICES 分区」；
      驱动名额的真实上限待专项实测后回填本节。
  - "结论性验证只在锁定镜像内做；日常调试容器结果不作为验收依据"
  - "任何镜像变更必须更新本文件并知会全组"
  - "起容器前自查：本机无其他带卡容器（有则与占用方共用容器或约时间）、镜像与本文件一致（含 registry_status）、容器名符合规范、卡资源空闲"
  - "合入把关五条：镜像与 stack.lock 一致 ｜ 容器/分支命名合规 ｜ 接口约定章节完稿且下游确认 ｜ 能跑自己那段 demo ｜ 无环境分叉"
  - |
    基座镜像入锁门槛：任何镜像进入本文件 lock: 前，dev/images/<name>/v<N>/ 必须存在且含 lock.yaml，
    repro_status ≥ 🟡（配方在手；组内镜像不涉及 registry，看能否凭仓内 Dockerfile.repro+assets 重建）；
    上游发布的镜像（华为昇腾官方 / 社区）可无 Dockerfile 但须有可拉取 digest。规范见 dev/images/README.md。
    统一基座的确定/调整/发布由总组裁定（依据各子方向 STATUS.md 暴露的问题与意见）；各方向只消费不自建
    （用锁定 tag 的本机镜像或执行方的 docker save 包），诉求写进本方向 STATUS.md 由总组收拢。

# ---------------------------------------------------------------
# 两条腿的运行方式约束（实测）
# ---------------------------------------------------------------
per_leg:
  train:
    device_backend: "npu（torch_npu autoload + FlagCX 原生 flagcx c10d 后端，Route A）"
    note: |
      v3 完整镜像是推理+训练超集，两腿共用同一镜像与 demo 容器，多项验证以
      ASCEND_RT_VISIBLE_DEVICES 分区（昇腾驱动对带卡容器独占，第二个带卡容器
      一律 EBUSY）。训练侧受已知限制约束：须手动多卡写法，每个 collective 后
      显式 torch.npu.synchronize()，不用列表形式 all_gather、不用原生 DDP 封装
      （A-2）；学习率显式用 1e-5（默认 5e-5 在 bf16+AdamW 下第 16 步 NaN，A-4）。
      v2 时代「禁止 torch_npu 与 Torch-FL 共存、必须先 import torch_fl」的约束
      是旧镜像的口径，v3 默认路径不 import torch_fl。
    python: "/usr/local/python3.11.15/bin/python3（= 两目录 Dockerfile.repro 的 ARG PYTHON_BIN；镜像内 Python 3.11.15）"
  infer:
    device_backend: "npu（torch_npu，Route A）"
    note: |
      与训练腿同一镜像、同一 demo 容器（V3 使命 = 两腿收敛同一基座）。原型的推理接入
      方式是 runtime/backends/ascend 后端 + vLLM 0.20.2（父基座自带）+ vllm-plugin-FL
      插件；受 A-1 约束，须落实 demo 的三项规避配置（shmem 占位模块挂载、PYTHONPATH
      前置、VLLM_FL_FLAGOS_BLACKLIST=cos,sin）方能启动。
  concurrency: "推理/训练共用容器时以 ASCEND_RT_VISIBLE_DEVICES 分区、串行执行；另起容器须遵守上方「带卡容器并发上限」规则"

