notes: |
  宿主与容器启动纪律（2026-09-22~10-14 device-context 方向在 tza-0a06-ai01-em9 真机实测，证据由该方向
  在其资产目录维护；2026-10-15 总组在 tza-0a06-ai02-em9 复核 ①③④⑤）：
  ① 档位由宿主驱动决定（本芯片独有，勿照抄别家「取最新线」思路）：实测宿主驱动 v6.2.29（6.2.x 线）
     ⇒ 用 neuware4.4.3 档（官方标注宿主驱动前置 6.2.15）；neuware4.7.2 档官方标注前置 6.5.48。
     选错档位的表现是容器内厂商库与宿主驱动不匹配。
  ② import triton 必须先 import torch_mlu，否则 triton 内部 import torch 触发设备后端自动加载并失败
     （RuntimeError: Failed to load the backend extension: mlu）——报错文案像设备问题、实为导入顺序问题；
     不要用 TORCH_DEVICE_BACKEND_AUTOLOAD=0 绕过（会一并影响 mlu 后端注册）。
     另：/opt/triton 只在经 shell 启动时进 PYTHONPATH（镜像 BASH_ENV=/etc/bash_env.sh），
     docker exec … python3 直调看不到 triton ⇒ 用 docker exec … bash -lc '…'。
  ③ 宿主无 /usr/local/neuware（只有驱动），全部 MLU 软件栈在镜像内 ⇒ 一切验证在带卡容器内做；
     cnmon 是宿主工具，须挂 -v /usr/bin/cnmon:/usr/bin/cnmon:ro 才能在容器内查卡。
  ④ 设备授予：非 privileged，不用 --runtime（寒武纪无容器 toolkit）；声明式 devices 授
     /dev/cambricon_ctl + /dev/cambricon_gdr + cambricon_dev0..7 + cambricon_ipcm0..7（共 18 个节点，
     缺 ctl 则设备枚举失效）；配 --cap-add=SYS_PTRACE 与 --security-opt seccomp=unconfined。
  ⑤ 选卡变量 MLU_VISIBLE_DEVICES（按授予顺序密集重编号；demo 映射全部 8 卡使容器内逻辑号 == 宿主
     物理号）。无带卡容器独占（同 P800 / PPU，与昇腾相反）；共享机上用卡前 cnmon 挑空闲卡。
  ⑥ 硬件能力：torch.mlu.get_device_capability() == (5, 0)（MLU590-M9 实测）。厂商 vLLM 手册标注
     FP8 需 >= (6, 0)、MX 类型需 >= (6, 1) ⇒ 本卡型两者均不可用；量化路径限 SmoothQuant 等。
  ⑦ torch_mlu 的 torch.mlu.Stream(priority=…) 对区间 (0, -3) 之外的取值静默接受、不报错
     （上游参数校验缺失）；消费方须自行按 stream_priority_range() 校验取值域。
  ⑧ PrivateUse1 为进程级单例 ⇒ 本后端不得与 torch_npu / torch_fl 同进程混用。
  ⑨ 厂商错误不透出数字码（形如 RuntimeError: CNRT error: invalid argument.）⇒ 错误分级只能依赖
     message 文本提示，不要假设存在可映射的厂商错误码表。

