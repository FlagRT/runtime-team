gaps:
  - >-
    `dev/lib/baseline.py` 不支持「wheel 单文件固化」：`COPY src/<Repo>/` 形态要求 pip install 的目标
    **恰等于** COPY 的目的目录（`copy()` 只接受两段路径；`pip install` 的 target 必须命中 dir_repo 键），
    而 `pip install <dir>/<file>.whl` 不命中 ⇒ 报「pip install 的来源未登记为固化 repo」。
    已作为待办提给总组（`dev/images/TODO.md`）：建议扩展 §4.2 识别「COPY 目录 + pip install 目录内 wheel」
    这一形态，使派生镜像能走 `export --image` 全自动入档。
  - >-
    本镜像**未 push** 到 registry（与组内镜像口径一致，RepoDigests 为空）⇒ 无 registry digest 锚；
    跨机分发须 `docker save`，而本仓已知巨型镜像 `docker save` 会静默导出空 tar（`dev/images/TODO.md` #21）。
  - >-
    triton 的 pip 元数据由本 wheel 提供（`flagtree-0.7.0+…dist-info` 覆盖 triton/ 与 flagtree/ 两个包目录），
    故 `pip show triton` 的版本字段口径与该 dist-info 一致、不等于 PyPI 上的 `triton 3.6.0` 条目 —— 排查时别混淆。
