notes: |
  宿主与容器启动纪律（2026-10-10~14 device-context 方向真机实测，证据由该方向
  在其资产目录维护）：
  ① 非 privileged；声明式 devices 授 /dev/alixpu + /dev/alixpu_ctl + 所用 alixpu_ppuN。
  ② --network host 下宿主主机名（ai-server）不在 DNS ⇒ torchrun/c10d rendezvous 会静默挂
     300s 后超时 —— 须 --add-host=ai-server:127.0.0.1（mp.spawn + tcp://127.0.0.1 不受影响）。
  ③ 镜像写死 NCCL_SOCKET_IFNAME=eth0 而本机真网卡是 bond0 ⇒ init_process_group('nccl') 能建组、
     真实 all_reduce 失败（Bootstrap: no socket interface found）—— 须显式覆盖 NCCL_SOCKET_IFNAME=bond0。
  ④ 选卡变量 CUDA_VISIBLE_DEVICES（按授予顺序密集重编号，同 P800）；无带卡容器独占（同 P800，
     与昇腾相反）。

