#             均不动）+ 新增 flagos-device-context@984687f（v0.4.0）与 FlagMemory@58e60a9
#             （v0.3.0）两份 pip-editable 挂载；无运行环境层包。装配沿训练腿 env/v2 先例
#             （editable 安装串行于 command 内、日志分件落仓根 evidence/），另按本镜像
#             scm 栈实测加安装前 git safe.directory（容器内生效，见 command 注释）。
#             2026-11-15 真机验收通过（910c-11 die4，避开他人容器 die0-1）：up.sh --strict
