#             set_device(0) 最小面 OK、flagmemory 0.3.0 导入 OK、npu connector 冒烟三件
#             全过（offload 导入 1/1 + backend 全链路搬运 1/1 + tier manager 3/3，判据族
#             = FM RUNBOOK §0 六判据 + T8 负例）、容器内无 VLLM_PLUGINS 环境变量；
