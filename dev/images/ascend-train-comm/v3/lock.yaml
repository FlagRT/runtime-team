known_issues:
  - id: "flagcx-broadcast-allgather-wrong-result (PHASE 2 STOP CONDITION, 2026-09-22)"
    description: >-
      真机 2 卡验证发现：FlagCX 0.13.0 @ 4e0e0cbcbf721169ca82348080f8353aebfe2c31
      的 `flagcx` c10d backend 下，`dist.broadcast(src=0)` 是静默 no-op（目标
      rank 未收到源 rank 的数据，观测值与广播前相同），`dist.all_gather`
      （tensor-list 形式）恒返回全零（与两个 rank 的真实输入值均不符），
      `dist.all_gather_object` 因此级联崩溃（EOFError，pickle 反序列化在损坏
      数据上失败）。相对地，`dist.all_reduce`（SUM）与 P2P `send`/`recv` 均
      验证正确（见 verify_flagcx_runtime_device_route_a /
      verify_flagcx_p2p_route_a）。直接后果：`train_qwen_1_5b_npu.py`
      （逐字节未改动，历史上在另一分支验证通过 2481 步/loss 1.95/
      4245-5428 tok/s 的同一份脚本）在本血统构建出的镜像里于
      `DDP(model, device_ids=[local_rank])` 构造阶段即失败：
      `RuntimeError: DDP expects same model across all ranks, but Rank 1 has
      338 params, while rank 0 has inconsistent 0 params.`——根因就是
      DDP 构造内部用于跨 rank 核对参数形状的通信调用依赖 broadcast/all_gather
      语义，而这两个原语在本 commit 的 flagcx backend 下已损坏。**未尝试打
      私有补丁或绕过 DDP 的形状校验**（绕过治标不治本：broadcast 本身损坏意味着
      各 rank 初始权重不会同步，继续训练只会静默产出不可信的数值结果，属于
      任务书 STOP CONDITION 1"产生错误的数值结果"明确要求停下的场景）。复现
      步骤、诊断脚本输出全文见 REBUILD.md 对应章节。**这是训练腿目前唯一的
      阻塞项，待 FlagCX 维护者或项目负责人裁定（例如换一个 FlagCX commit 重测、
      或联系 FlagCX 上游报告这个 broadcast/all_gather bug）。**
      【ROUND 3 追加，2026-09-23，PENDING】项目负责人指出本机
      `FlagRT/vllm-plugin-FL` 私有 fork 的 commit `5d545c9` 提出一个"缺
      torch.npu.synchronize()"假说（flagcx backend 异步返回，读结果前必须
      同步）——可能是本条目的诊断脚本当年漏了同步，而不是 FlagCX 真的坏了。
      直接验证脚本（`flagcx_sync_test.py`，对比 sync/no-sync 两种模式）已
      写好，因机器带卡容器并发持续超限（同一阻塞源，另见
      operator-runtime/v3 lock.yaml 的 vllm-plugin-fl-real-hardware-
      validation-pending）本轮**未能执行，结果未知，PENDING**。本条目结论
      在有真机证据推翻它之前继续视为真实、未解决。见 REBUILD.md「ROUND 3」
      一节完整设计与待办。
  - id: "teardown-sigabrt (carried forward from v2, PHASE 2 RE-VERIFIED: reproduces in v3 default path too)"
    description: >-
      v2 记录的已知问题：成功完成集合通信后进程退出阶段 "free(): invalid
      pointer" SIGABRT。v2 曾推测根因是"FlagCX 与 Torch-FL 各自退出期清理顺序
      冲突"，并推论"v3 默认路径不 import torch_fl，可能不复现"。**PHASE 2
      实测推翻了这个推论**：`verify_flagcx_runtime.py --device` 与
      `verify_flagcx_p2p.py` 在 v3 默认路径（完全不 import torch_fl，
      TORCH_DEVICE_BACKEND_AUTOLOAD 未设置）下，均在成功完成真实通信、
      结果正确之后，于进程退出阶段同样报 `free(): invalid pointer` SIGABRT。
      **这意味着根因不是"FlagCX 与 Torch-FL 的清理顺序冲突"**（v3 路径完全
      不触碰 torch_fl），必须是 FlagCX 自身的退出期清理逻辑问题，或 FlagCX 与
      torch_npu（而非 torch_fl）之间的清理顺序冲突——具体是哪个，本阶段未
      进一步定位（不在 STOP CONDITION 范围内，因为两个 verify 脚本按设计在
      teardown 前已打印出正确结果，不影响功能性判定，只是"退出码不可信"这条
      既有结论继续成立，且适用范围比原先认为的更广）。

