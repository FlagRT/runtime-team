# 设计约束（构造使然，非缺陷）
design_constraints: |
  镜像刻意不含 torch_npu：verify_flagcx_runtime.py 在构建期断言 torch_npu 不存在，FlagCX 的 .so
  强制链接 libflagos.so/libascendcl.so/libhccl.so 且断言不链 torch_npu。因此容器内
  torch.npu.device_count()==0 是预期行为，训练腿必须走 torch_fl（先 import torch_fl 再 import torch）。
  这更正了 DIAG_TRAIN_IMAGE_NPU_20260908.md 中"镜像打包时组件缺失"的推测。

mainline_fallback: |
  官方主线是 torch_npu（Route A）。回退路径 = 改用 ascend-operator-runtime/v1（父镜像）
  + 容器内移植 torch_npu，即设备上下文 08-24 的 A 线做法（flagos-device-context-a-910c）。
  stack.lock device_registration 已记 TODO：10 月评估训练腿切回 Route A。

