# 2026-10-24  新建 demo（随目录首登）：形态 = 入锁验收当日所用（18 设备节点 + cnmon + 仓根 +
#             模型目录 + host 网络/shm64g/seccomp+SYS_PTRACE，working_dir 对齐 serve_standard
#             相对路径）。SERVE_STANDARD_PASS (ready=1 smoke=1) 于本形态取得（HWJ_1，dev0，
#             Qwen3-Embedding-0.6B，init engine 149.5s）。
