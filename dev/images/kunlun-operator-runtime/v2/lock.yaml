layers:
  - name: "FlagTree xpu3.6 预构建基座镜像"
    origin: official
    pin: "harbor.baai.ac.cn/flagtree/flagtree-xpu3.6-py310-torch2.9.0-ubuntu22.04:202608-base@sha256:ea6d797a7d44ef97d7c0c0ed492f69c8ed2e024c927b2bfb5eef53e498e4eb34"
    note: "BAAI·FlagTree 官方发布，公开 harbor，无需 BAAI 内部账号，本机已存在"
  - name: "flagtree（提供 triton 编译器/运行时，import 名为 triton）"
    origin: official
    pin: "flagtree===0.6.1+xpu3.6（BAAI·FlagTree 官方 PyPI 索引 resource.flagos.net/repository/flagos-pypi-hosted，预编译 wheel，非源码构建）"
    note: >-
      pip dist 名为 flagtree，但安装内容落在 triton/ 顶层命名空间下（"forked from
      triton-lang/triton"），import 后 triton.__version__ == 3.6.0。**无 git commit**，
      版本锚是 version：ARG == 镜像标签 io.flagrt.flagtree.version == 镜像内实装 dist 版本
      三方核对（dev/ENV-SPEC.md §4.2 模式 6），由 baseline.py export/check 机器执行。
      不记 sha256：pip 索引不提供稳定直链，且该 wheel ~3.3GB，下载成本与收益不匹配
      （见 dev/images/TODO.md 待定项）。
      必须 --no-deps 安装，否则 pip 解析 torch 的可选依赖会额外装 PyPI 通用
      triton==3.5.0，物理覆盖 flagtree 的 triton/ 目录
      （见 ../v1/lock.yaml known_issues: flaggems-kunlunxin-extras-missing）。
  - name: "FlagGems（flag_gems 4.2.1.rc.0，即 v4.2.1.rc.0-177）"
    origin: official
    pin: "git commit 73c5aff1e304c293ab525ecb03e9449644496fbb（flagos-ai/FlagGems 公开上游主干，非 FlagRT/FlagOS fork）"
    note: >-
      v2 改为 COPY src/FlagGems/ 自备构建上下文（§4.2 模式 1），上下文由 build.sh 从宿主
      checkout 按 ARG commit 做 git archive；v1 是 `cd /env/FlagGems && pip install .`
      （父镜像内的可变源码目录，本仓无法寻址也无法核验）。改动后 commit 锚由
      宿主 checkout + ARG + 镜像标签 io.flagrt.flag_gems.commit 三方自动成立。
      安装为非 editable，覆盖父基座的 editable 安装（image.baseline.yaml 中该条目的
      supersedes 字段留痕）。该 commit 的 pyproject.toml 没有 kunlunxin extras 组，
      见 ../v1/lock.yaml known_issues: flaggems-kunlunxin-extras-missing。

