  （`pip install flagtree===<ver>+xpu3.6 --index-url=...flagos-pypi-hosted...`），
  无需源码编译——这是本血统与昇腾侧的根本差异：**没有 git commit，只有版本号**，
  故记在 image.baseline.yaml 的 baked_packages 块（dev/ENV-SPEC.md §4.2 模式 6）。
  本条目沿用 v1 的 pin 0.6.1+xpu3.6（memory、device-context 两个子方向已各自验证过
  该具体组合可用），不跟随手册最新版本。
