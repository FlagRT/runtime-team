  若本层不满足需求，基于 parent_image 自行按同样模式重建、改 pin 后验证即可，不依赖本层。

dockerfile: |
  Dockerfile.repro = 唯一配方，build.sh 驱动。build.sh 自备构建上下文：
  src/FlagGems <- 仓库根 FlagGems/ @ ARG FLAG_GEMS_COMMIT（git archive，只含已提交内容，
  并检查该 commit 已推送到远端）。无需从既有镜像 docker history 还原。

