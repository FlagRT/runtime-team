  （https://github.com/flagos-ai/FlagTree/wiki/User-manual-for-xpu），线号 xpu3.6
  （CANN 概念不适用于昆仑芯）。宿主驱动与运行时：XPU-RT 5.0.21 / driver 5.0.21.47
