known_issues:
  - id: "gemm-failure-signature-differs-from-v1"
    description: >-
      v1 记录的 GEMM 失败形态是**编译期 SIGABRT**，栈顶
      `triton/backends/xpu/compiler.py:486 make_llir`（见 ../v1/lock.yaml
      known_issues: gemm-compile-sigabrt）。本轮在 v2 上以 64×64 的
      `torch.mm` 探同一路径，实测失败形态是
      `triton.runtime.errors.OutOfResources: out of resource: uni_sram PassManager::run`，
      退出码 1（进程正常抛异常，未 SIGABRT）。证据：
      assets/evidence/verify-v2-card7-PASS.txt 的 `[KNOWN] flag_gems/mm` 行。
      两者都指向「该 flagtree/triton 版本线下 FlagGems 的 GEMM 编译路径不可用」，
      但**是不是同一个缺陷未定论**：本轮用的矩阵形状（64×64）与 v1 走的
      FlagGems 自带 pytest 用例形状不同，形态差异可能来自形状，也可能是两个不同缺陷。
      本条目只记录观测到的事实，不把两者并为一条。
    impact: >-
      不改变消费结论——GEMM 类算子在本 pin 组合下都不可用，消费方该绕的还是要绕。
      影响的是根因定位：若后续要向上游报缺陷或验证修复，需要先用 v1 的
      pytest 用例形状在 v2 上复跑一次，确认 SIGABRT 形态是否仍然复现
      （已登记到 dev/images/TODO.md）。
  - id: "flagtree-wheel-no-sha256"
    description: >-
      flagtree 以 pip 索引发行包形式固化（dev/ENV-SPEC.md §4.2 模式 6），基线只记
      version + index_url，**不记 sha256**。pip 索引不提供稳定直链，要算 sha256 需先
      解析索引页或 `pip download --no-deps`，而该 wheel ~3.3GB、经代理必断流
      （见 REBUILD.md 踩坑 1）。因此若上游以同一版本号重新发布不同内容（index 重发），
      基线无法察觉——这是本血统相对「commit + sha256」锚定方式的真实弱点。
    impact: >-
      缓解手段有两条：① 版本锚三方核对（ARG == 镜像标签 == 镜像内实装 dist 版本）由
      export/check 机器执行，能发现「配方说装 A、镜像里实际是 B」；② 版本事实最终由
      image id 唯一确定（§2），只要用的是归档镜像就不受 index 重发影响。
      要不要为该 wheel 补 sha256 是待定项，见 dev/images/TODO.md。
  - id: "shared-host-disk-pressure"
    description: >-
      本机 /var/lib/docker 使用率 99%（5.9T 中剩 ~105G），本层构建增量约 11GB
      （绝大部分是 flagtree wheel 解包后的体积）。共享机上多人各存若干 100GB 级镜像，
      余量随时可能被他人占用。
    impact: >-
      重建前先 `df -h /var/lib/docker` 确认 ~15GB 余量（build.sh 前置已注明）。
      本条目不是镜像缺陷，是重建该镜像的环境前提。

