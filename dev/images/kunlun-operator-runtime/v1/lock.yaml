recommended_default: >-
  本层同时包含训练（transformers+FlagCX）与推理（vLLM+vllm-plugin-fl）所需
  组件（见 parent_image.note），是训练/推理场景的**推荐默认底座**，无需按
  场景再拆两个镜像。两条路径均已真机验证可用（见 `repro_result.e2e_smoke_training`
  / `e2e_smoke_inference`），各有一条使用前提：
  - **推理（单卡 vLLM）**：须显式设置 `VLLM_FL_PREFER=vendor`（默认 dispatch
    在 EngineCore 初始化阶段崩溃，见 known_issues:
    flagos-index-select-invalid-device-function）。
  - **训练（多卡 flagcx 集合通信）**：须遵守共享机用卡纪律——`xpu-smi` 挑
    连续且空闲的同 NUMA 组卡（本机 NUMA0=卡0-3、NUMA1=卡4-7），卡 1 历史上
    反复被其他租户占用，应优先避开（见 REBUILD.md「GPU/机器纪律」）。
  消费前需知晓上述两条 + GEMM 编译崩溃 + `XPU_EVENT_KL3_ENABLE` 挂死共四条
  已知限制（见 known_issues）。
  回退路径：本层是从 `parent_image`（官方基座）按 `Dockerfile.repro` 单向
  构建而成，若本层不满足需求，基于 `parent_image` 自行按 `Dockerfile.repro`
  的模式重建、更改 pin 后验证即可，不依赖本层。

dockerfile: |
  Dockerfile.repro = 唯一配方（从官方基座直接 pip/git 安装构建，无需从既有
  镜像 docker history 还原）。build.sh 驱动。

