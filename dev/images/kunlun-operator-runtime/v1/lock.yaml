known_issues:
  - id: "gemm-compile-sigabrt"
    description: >-
      FlagGems 的 GEMM 类算子（mm/bmm/addmm）在本 pin 组合
      （flagtree 0.6.1+xpu3.6 / triton 3.6.0 / FlagGems @73c5aff1）下
      **实测复现** SIGABRT 崩溃，栈顶为
      `triton/backends/xpu/compiler.py:486 make_llir`（编译期 LLIR
      生成阶段原生崩溃），经 autotuner → libentry →
      `flag_gems/runtime/backend/_kunlunxin/ops/mm.py:168` 触发。
      与 memory 子方向此前在旧 dev 容器（同 triton 3.6.0 线）的独立实测
      记录（dev/memory/docs/goals/bringup-p800/profile_P800可用性实测_p800.md:96-99,134）
      栈完全一致——**不是环境偏差导致的偶发问题，是该 flagtree/triton
      版本线本身对 GEMM kernel 编译路径的确定性缺陷，与 FlagGems 具体
      pin 到哪个 commit 无关**（FlagGems 主分支当前 HEAD 的 pyproject.toml
      锁 `flagtree==0.6.1+xpu3.6`，见 known_issues:
      flaggems-kunlunxin-extras-missing，本条目即是该声明版本组合下的
      直接产物）。device-context 独立发现
      FlagGems 仓库 `backends.yaml` 仍声明 `triton==3.0.0+a48aedef`
      （xpu3.0 时代遗留，与 xpu3.6 线不符），佐证这是上游版本声明滞后、
      未跟随 xpu3.6 线回归测试 GEMM 路径的结果
      （dev/device-context/P800/docs/KUNLUN_P800_ROOT_CAUSE_VERIFY_20260914.md:170）。
      当前无可用 workaround（官方发布栈用 triton 3.0.0 线可绕开，
      但那是另一条不同的版本线，不在本条目复现范围内）。
    impact: >-
      不影响本条目 repro_status 判定为 🟢——入档门槛（README §5）要求的是
      "配方可重建 + 关键包版本对齐基线"，GEMM 崩溃是**镜像内容本身的真实
      运行时行为**且已被证据完整记录，不是"配方未验证"。消费方（阶段3
      推理链路，需要 GEMM 重的模型/算子路径）在引用本镜像前必须知晓此
      限制；是否需要等上游修复、切换 triton 版本线或寻找 workaround，
      由消费方文档/总组裁定，不在本目录职责内。
  - id: "flaggems-kunlunxin-extras-missing"
    description: >-
      FlagGems commit 73c5aff1（v4.2.1.rc.0-177）的 pyproject.toml
      `[project.optional-dependencies]` 只有 `test`/`example` 两组，
      **没有 `kunlunxin` extras 组**。`pip install .[kunlunxin]`
      不会报错中止，只打一行 `WARNING: flag-gems 4.2.1rc0 does not
      provide the extra 'kunlunxin'` 并静默退化为裸装 `pip install .`——
      此时 pip 会正常解析 `torch>=2.2.0` 的完整依赖图，包括 torch
      在 x86_64+cuda 平台的可选依赖 `triton==3.5.0`（PyPI 通用 triton
      包，与 flagtree 是两个不同的 pip 发行名，但共享 `triton/` 顶层
      导入命名空间），把它装进同一 site-packages，**物理覆盖 flagtree
      提供的 triton/ 目录**（flagtree 540 个记录文件 vs 通用 triton
      480 个，两者路径大量重叠）。覆盖后 `triton._C.libtriton.so`
      变成不含 xpu 扩展的通用版本，`triton/backends/xpu/compiler.py`
      导入即 `ImportError: cannot import name 'xpu' from
      'triton._C.libtriton'`——flagtree 整体不可用。**必须
      `pip install --no-deps .` 安装 FlagGems**，不能用 `[kunlunxin]`
      写法（当前 commit 下该写法无效且有副作用）。FlagGems 主分支当前
      HEAD 的 pyproject.toml 含 `kunlunxin` extras 组（锁定
      `torch==2.9.0+cu129`、`flagtree==0.6.1+xpu3.6`），但该 extras 组在
      commit 73c5aff1 尚不存在——本条目按 commit 73c5aff1 的实际文件内容
      记录。
    impact: "已在 Dockerfile.repro 用 --no-deps 规避，repro_result 确认 triton 命名空间未被污染（triton.__version__==3.6.0，非 3.5.0）。"
  - id: "xpu-event-kl3-enable-hang"
    description: >-
      单卡单进程场景下，设置 `XPU_EVENT_KL3_ENABLE=1`（xpu 用户手册要求的
      环境变量）后运行 FlagGems pytest（即便是最简单的 rmsnorm 单测），
      **实测挂死**：进程长时间处于 `S`（sleeping, futex_wait_queue）状态，
      CPU 时间不再增长，GPU 利用率归零，`timeout`/`SIGTERM` 均无法使其
      退出，须 `SIGKILL`。去掉该环境变量后同一用例 2.82s 内 PASSED。
      复现条件是单卡单进程、无任何集合通信，比 device-context 已定位
      的触发条件（`XPU_EVENT_KL3_ENABLE=1` + 设备侧集合通信 flagcx，
      libxpucuda.so 内自旋，
      dev/device-context/P800/docs/KUNLUN_P800_ROOT_CAUSE_VERIFY_20260914.md）
      更宽。是否同一缺陷的更广泛触发面，还是共享机上与其他用户进程的设备
      争用导致的另一种表现，尚未定位。
      本条目的验证与最终镜像均在**不设置** `XPU_EVENT_KL3_ENABLE` 的
      情况下完成；build.sh/REBUILD.md 的验证命令已注明不要设置该变量。
    impact: >-
      xpu 用户手册要求设该变量，但本条目验证发现在单卡场景下设置会挂死。
      是否所有场景都不需要该变量、还是仅特定路径（如多卡集合通信）才
      需要，尚未定论，记录为已知问题供消费方与总组决策参考。
  - id: "flagos-index-select-invalid-device-function"
    description: >-
      vLLM serve 默认 dispatch 策略下（`vllm-plugin-fl` 的
      `kunlunxin.yaml prefer=flagos, strict=false`，未显式设置
      `VLLM_FL_PREFER`），rotary embedding 计算里的 `index_select` 算子经由
      FlagGems（flagos）OOT 路径调用，触发
      `torch.AcceleratorError: CUDA error: invalid device function`（栈：
      `flag_gems/runtime/backend/_kunlunxin/ops/index_select.py` →
      `dim_compress` → `.../ops/copy.py:copy_`），vLLM EngineCore
      初始化直接失败，服务起不来。与 known_issues: gemm-compile-sigabrt
      同根因家族——本 pin 组合（flagtree 0.6.1+xpu3.6）下 triton 编译产物
      在该 P800 硬件上不止 GEMM 一类算子不可靠，`index_select` 是本条目
      新发现的第二类受影响算子。**workaround**：设置
      `VLLM_FL_PREFER=vendor`（`vllm-plugin-fl` 自带的标准 dispatch
      优先级配置项，非本条目临时发明的变通），令 `attention_backend` 等
      算子走厂商原生实现而非 FlagGems，实测服务可正常启动且请求成功返回
      （见 `repro_result.e2e_smoke_inference`）。
    impact: >-
      消费方用本镜像跑 vLLM 推理时，**若使用默认 dispatch（flagos 优先）
      会直接崩溃**；必须显式设置 `VLLM_FL_PREFER=vendor` 才能起服务。是否
      修复 flagtree/FlagGems 使 flagos 路径在该 pin 组合下可用，不在本目录
      职责范围内。
  - id: "docker-save-broken-on-this-host"
    description: >-
      本机 Docker Engine 29.1.3 + containerd snapshotter 存储后端
      （`docker info` 显示 `driver-type: io.containerd.snapshotter.v1`）
      下，`docker save`（对本镜像、对未改动的基座官方镜像均如此，非本
      镜像特有）只导出 manifest/config blob，**不导出任何 layer blob**——
      产出的 tar 仅 ~14KB，`docker load` 该 tar 会因 blob 缺失而无法
      正确重建镜像。本条目的离线归档改用 `docker export`（导出容器
      展平后的 rootfs 单层 tar）+ 手工在 `docker import --change` 里
      重放 ENV/CMD/WORKDIR/LABEL 以保留功能等价性，细节见 ARCHIVE.md。
      这是本机 Docker 环境的缺陷，不是镜像本身的问题；换一台不用
      containerd snapshotter 后端的机器上 `docker save`/`docker load`
      预期正常。
    impact: "ARCHIVE.md 的 docker load 用法一节实际是 docker import 用法，已注明差异及原因。"

