known_issues:
  - id: "triton-2-active-drivers"
    description: >-
      真机验证中发现:FlagTree 顶层 triton 驱动自动发现把 Torch-FL 的生态兼容
      shim(torch.cuda.is_available 恒真)误判成"CUDA 也 active",与真正的
      NPUDriver 冲突报错。已通过 assets/patch_triton_ascend_flagtree.py 第 4
      条补丁修复(给 CudaDriver.is_active() 加 torch.version.cuda is not None
      检查),已验证修复后 FlagGems/triton kernel 真机正确执行。

