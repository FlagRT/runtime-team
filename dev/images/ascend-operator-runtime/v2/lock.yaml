superseded_by: null   # v1 未被本版本取代——两条血统并存,详见 image_list.md"当前生效版本"

image_tag: "flagrt/ascend-operator-runtime:1.0.0-flagtree3.5-cann9.0-py311-torch2.10-arm64"
flagtree_line: >-
  ascend3.5,与 v1 版本纪元相同(CANN 9.0.0 / py3.11 / torch 2.10.0),但 v2 是
  第一次真正按 BAAI·FlagTree 官方 ascend3.5 手册的构建路径产出的镜像:官方预构建
  基座镜像 + checkout triton_v3.5.x + FLAGTREE_BACKEND=ascend 现场编译,而不是像
  v1 那样直接 pip 装上游 triton wheel + 华为 triton-ascend wheel、底座另找 BAAI
  内部手工镜像。triton 实测版本 3.5.1(手册版本线表格暗示 3.5.0,如实按实测记录,
  不采信手册假设)。
built_at: "2026-09-12"
builder: "Docker 20.10 / arm64 / DOCKER_BUILDKIT=0, --network=host"
repro_status: "🟢 functional-repro"   # 2026-09-12 实机构建 + 静态自检通过,见 REBUILD.md

dockerfile: |
  Dockerfile.repro = 唯一配方(本血统没有"从 docker history 还原"的 Dockerfile——
  这是全新血统的首次构建,不是既有镜像的事后重建)。build.sh 驱动。

