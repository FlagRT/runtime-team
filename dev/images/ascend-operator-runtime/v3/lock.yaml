      `docker build --network=host` 在 vllm-ascend 安装层失败：
      `ERROR: Could not find a version that satisfies the requirement
      triton-ascend==3.2.1 (from vllm-ascend) (from versions: 3.2.0rc2,
      3.2.0rc3, 3.2.0rc4, 3.2.0)`。根因：base 镜像 pip index-url 为纯公开
      PyPI（`https://pypi.org/simple`），该索引从未发布过 triton-ascend
      3.2.1——这个精确版本号历来只能从 `quay.io/ascend/vllm-ascend:v0.20.2rc1-a3`
      官方镜像内提取 wheel 获得（`dev/images/image_list.md` 版本线表格已记录
      这一事实）。不是版本号猜错（vllm-ascend 的精确 commit pin 已单独核实
      正确，见 open_questions.vllm-ascend-exact-pin 的 resolution），是这条
      公开依赖链本身在纯 `pip install .` 场景下不可解析。**round 2 没有解决
      这个问题**——是换用 vllm-plugin-FL 绕开了它，如果日后仍想用 vllm-ascend
      本身，这个 STOP CONDITION 依然成立。详见 REBUILD.md 中的历史记录一节的
      候选解法列表（均未执行，待总组裁定）。
  - id: "vllm-ascend-pin-unverified"
    description: "【PHASE 2 ROUND 1 RESOLVED】见 open_questions.vllm-ascend-exact-pin 的 resolution——已实测核实为 367b8e62da799870a7476ce34f5f7658589a8aad。本条目保留作为历史记录，round 2 不再涉及 vllm-ascend。"
  - id: "vllm-plugin-fl-real-hardware-validation-pending (PHASE 2 ROUND 2, 2026-09-22)"
    description: >-
      vllm-plugin-FL 已实测构建成功（image id `9ad551058f2f`），但 Step 5 真机
      vLLM 推理烟雾测试（用真实 `generate()` 输出文本确认非乱码/非 CPU 回退）
      与训练/推理共存检查**均未执行**，原因是本轮会话观测期间机器带卡容器并发
      数持续保持在 5（超过上限 3，是其他工程师的活跃工作负载，非本任务所起）。
      这不是技术性失败，是共享机器资源约束——按任务书要求未强行起容器抢占
      已在跑的设备。**在这一项完成之前，不能认为 vllm-plugin-FL 路径已经"验证
      通过"，只能说"构建通过"**——尤其是 REBUILD.md「FlagRT 私有 fork 的发现
      与决策」提到的两个已知 PrivateUse1 类型提升 bug（token id 坍缩成 1 /
      flagcx backend 异步同步问题）是否会在本血统的 torch_npu 路径上实际触发，
      仍然未知。`repro_status` 因此维持 🟡 partial-repro。见 REBUILD.md
      「ROUND 2 真机验证结果」的待办清单。
  - id: "verify_runtime.py torch_fl._C find_spec side-effect bug (PHASE 2 found+fixed, 2026-09-22)"
    description: >-
      `find_spec(\"torch_fl._C\")` 隐式 import 父包 `torch_fl`，在 PrivateUse1
      已被 torch_npu 抢注时触发 `torch_fl.__init__.py` 的
      `_check_privateuse1_unclaimed()` 抛出未捕获的 RuntimeError，导致
      `verify_runtime.py` 哪怕不带 `--check-torch-fl-guard` 也会崩溃退出，从未
      打印出预期 JSON。已在 `assets/verify_runtime.py` 修复（try/except 捕获，
      记录为证据），已用 `docker cp` 在真机容器内验证修复生效。见 REBUILD.md
      详述。

