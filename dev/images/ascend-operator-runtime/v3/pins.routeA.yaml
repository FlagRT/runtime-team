# v3 候选血统版本声明。schema 见 dev/ENV-SPEC.md §4。
# image digest 权威来源：本目录 lock.yaml 的 image_id（此处补全 sha256: 前缀）。
# repos 的 commit 权威来源：本目录 Dockerfile.repro 的 ARG（Torch-FL/FlagGems）与
# ../../ascend-train-comm/v3/lock.yaml 的 layers.pin（FlagCX）/ lock.yaml 的
# vllm_plugin_fl_exact_commit_verified（vllm-plugin-FL）。
#
# 不含 FlagTree：Dockerfile.repro 在容器构建期自己 `git fetch <commit>` 并断言
# HEAD 等于该 commit（见其 "git fetch --depth 1 origin ${FLAGTREE_COMMIT}" 一步），
# 不读取、不依赖宿主的 FlagTree/ 检出——宿主检出与镜像内容完全无关，strict 校验
# 对它不适用（曾误加过一条，核实后移除）。

image:
  ref: flagrt/ascend-operator-runtime-comm:2.0.0-flagtree3.5-routeA-cann9.0-py311-torch2.10-flagcx0.13.0g4e0e0cb-arm64
  digest: sha256:e13a15d0d02b86e9cd7b1656df3c6b52838c258f270b6b894a91c2b074da5f15   # round 4 rebuild 2026-10-09 npu1-11 本机重建（含声明式覆盖层补丁）；npu1-27 侧为 7028028bb62c…（镜像 id 跨机不同属预期，内容同源：同 Dockerfile.repro + 同 pin commit + 同补丁，三重证据齐）

repos:
