# FlagOS 运行时组公共资源配置（所有子方向共享，变更需全员知会）
# 子方向 compose 通过 -f 多文件合并本文件（后文件覆盖前文件）；版本事实源：VERSIONS.md（镜像 tag 变更须同步两处）
# 需要 docker compose v2（-f 多文件合并，后文件覆盖前文件；序列字段如 devices 需整值替换时用 !override，需 ≥2.24，!reset 会清空）
#
# 本镜像 = 昇腾工具链底座（CANN 9.0.0 + Python 3.12 + 昇腾工具链全套）；预装 torch_fl 0.1.0，但 A 线（厂商 torch_npu）不使用它。
# A 线 venv 组合 / 结论性测试用的官方镜像见各子方向 README（memory→vllm-ascend；device-context→ascend-operator-runtime / flagos-infer）。
# 镜像名 pytorch-plugin-fl 与下方 /data_lib 挂载均为 B 线（torch_fl，已冻结归档）血统残留，保留无害，勿据此误判本底座绑定 B 线。

services:
  runtime-dev:
    # 公共开发镜像（tag 见 VERSIONS.md §2；子方向如需不同镜像可在其 compose 中覆盖）
    image: flagos-dev/pytorch-plugin-fl:manual-20260807-ascend-dev-hostnet
    network_mode: host
    ipc: host
    shm_size: 512g
    ulimits:
      memlock: -1
    cap_add:
      - SYS_PTRACE
    # 开发容器保持存活：无 tty 时 bash 作为 CMD 会立即退出（exit 0）
    tty: true
    stdin_open: true
    # 昇腾设备节点：机器固有路径，与代码布局无关，勿改
    devices:
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci1:/dev/davinci1
      - /dev/davinci2:/dev/davinci2
      - /dev/davinci3:/dev/davinci3
      - /dev/davinci4:/dev/davinci4
      - /dev/davinci5:/dev/davinci5
      - /dev/davinci6:/dev/davinci6
      - /dev/davinci7:/dev/davinci7
      - /dev/davinci8:/dev/davinci8
      - /dev/davinci9:/dev/davinci9
      - /dev/davinci10:/dev/davinci10
      - /dev/davinci11:/dev/davinci11
      - /dev/davinci12:/dev/davinci12
      - /dev/davinci13:/dev/davinci13
      - /dev/davinci14:/dev/davinci14
      - /dev/davinci15:/dev/davinci15
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
    volumes:
      # 代码库总目录：../ = 公共仓根（dev/ 的上级，嵌套布局总目录）
      # 自动解析：compose 相对路径按首个 -f 文件所在目录解析
      - ../:/workspace
      # B 线（torch_fl，已冻结归档）残留：torch_fl 编译脚本硬编码引用 /data_lib/PyTorch-Plugin-FL；
      # A 线不需要此挂载，保留无害且维持已归档 B 资产可复现，勿删
      - ../PyTorch-Plugin-FL:/data_lib/PyTorch-Plugin-FL
      # 昇腾驱动（只读）：机器固有路径，与代码布局无关
      - /usr/local/Ascend/driver:/usr/local/Ascend/driver
    environment:
      # 公共运行环境（阶段4 验证，全组通用）
      - GEMS_VENDOR=ascend
      - TRITON_ENABLE_TASKQUEUE=false
      - FLAGCX_PATH=/workspace/FlagCX/plugin/torch
      # vLLM usage 上报线程在容器内解析 cpuinfo 报错（跑 vLLM 的方向必需）
      - DO_NOT_TRACK=1
      # HCCL 多进程必需
      - HCCL_NPU_SOCKET_PORT_RANGE=16666,16676
