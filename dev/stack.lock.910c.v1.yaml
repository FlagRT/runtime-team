# 锁定镜像（两腿）
# ---------------------------------------------------------------
lock:
  train:                                # 训练腿：2 卡分布式微调
    image: "flagrt/ascend-operator-runtime-comm:0.1.3-cann9.0-py311-torch2.10-flagcx0.13.0g55eb2ffp2-arm64"
    notes: "容器内补装 transformers；通信库与算子库已内置。release.stage=candidate（torch_fl 例外线，非官方主线）"
    container_name: "flagos-proto-train-910c"
    base_image_entry: "dev/images/ascend-train-comm/v1"        # 血统 / 内置版本 / 重建配方 / 离线归档指针
    registry_status: "组内镜像，无 registry 要求；构造与重建见 base_image_entry（repro_status 🟢 functional-repro，2026-09-10 实机验证）"
  infer:                                # 推理腿：单卡推理服务
    image: "quay.io/ascend/vllm-ascend:v0.20.2rc1-a3"
    notes: "推理框架 0.20.2 官方自带"
    container_name: "flagos-proto-infer-910c"
    base_image_entry: "dev/images/ascend-infer-vllm/v1"
    registry_status: "官方镜像，已验证可拉取（2026-09-09，digest sha256:5cf8a2b6db8b06eb1bc7fc7d191d667aebf2b197351bdba13f776918c11ec7a7）｜ repro_status 🟢"

# ---------------------------------------------------------------
# 基座组件（设备上下文已交付，全组下游使用）
# ---------------------------------------------------------------
runtime:
  component: "统一运行时 API + Backend 注册表 + 昇腾后端"
  version: "0.1.0"
  location: "dev/device-context/runtime/"
  entry: "runtime.use(\"ascend\") 一行接入；接口见 docs/INTERFACE_CONTRACT_DC_20260908.md"
  conformance_baseline: "13/13 + 6/6（910C 真机）"
  feedback: "问题反馈 device-context，按周迭代组件版本"

# ---------------------------------------------------------------
# 使用规则（第 1 条为最高优先级，实测取证，出现事故先查它）
# ---------------------------------------------------------------
rules:
  - |
    【最高优先级】带卡容器并发上限 3：同一时刻最多 3 个挂载 NPU 设备的容器同时运行。
    超限后新容器内 acl.init() 返回 500000（ACL_ERROR_INTERNAL_ERROR），
    伴随 DrvMngGetConsoleLogLevel failed(ret=4) / path string is NULL，
    表现为 torch.npu.device_count()=0、设备"凭空消失"。
    → 出现 500000 / 设备不可见，第一时间核查并发容器数（docker ps 数带卡容器），
      不要先怀疑镜像、驱动或代码。
    → 两条腿（训练/推理）不需要同时跑：串行执行即可，跑完一条停掉再起下一条。
  - "结论性验证只在锁定镜像内做；日常调试容器结果不作为验收依据"
  - "任何镜像变更必须更新本文件并知会全组"
  - "起容器前自查：并发容器数 ≤3、镜像与本文件一致（含 registry_status）、容器名符合规范、卡资源空闲"
  - "合入把关五条：镜像与 stack.lock 一致 ｜ 容器/分支命名合规 ｜ 接口约定章节完稿且下游确认 ｜ 能跑自己那段 demo ｜ 无环境分叉"
  - |
    基座镜像入锁门槛：任何镜像进入本文件 lock: 前，dev/images/<name>/v<N>/ 必须存在且含 lock.yaml，
    repro_status ≥ 🟡（配方在手；组内镜像不涉及 registry，看能否凭仓内 Dockerfile.repro+assets 重建）；
    官方镜像可无 Dockerfile 但须有可拉取 digest。规范见 dev/images/README.md。
    统一基座的确定/调整/发布由总组裁定（依据各子方向 STATUS.md 暴露的问题与意见）；各方向只消费不自建
    （用锁定 tag 的本机镜像或执行方的 docker save 包），诉求写进本方向 STATUS.md 由总组收拢。

# ---------------------------------------------------------------
# 两条腿的运行方式约束（实测）
# ---------------------------------------------------------------
per_leg:
  train:
    device_backend: "flagos（torch_fl）"
    note: |
      该镜像禁止 torch_npu 与 Torch-FL 运行时共存（自带校验脚本会直接报错）；
      必须 TORCH_DEVICE_BACKEND_AUTOLOAD=0 且先 import torch_fl 再 import torch。
      我们的原型通过 runtime/backends/flagos 后端接入。
    python: "/usr/local/python3.11.15/bin/python3"
  infer:
    device_backend: "npu（torch_npu）"
    note: "镜像自带 torch_npu，我们的原型通过 runtime/backends/ascend 后端接入"
  concurrency: "两条腿串行；确需并行时须确保带卡容器总数 ≤3"

