# 验收样例 tiering-async-ppu 的自建运行环境目录（ENV-SPEC §3.2「各方向自建」形态，自由命名）。
# 本目录 = 一套完备运行环境：本文件（启动与装配）+ env.baseline.yaml（版本事实，由
# dev/lib/baseline.py export 生成，不手工编辑）。
#
# 【构成】thead-ppu-runtime v2 镜像（id 1ba7ead1…，基线 ../../../../../dev/images/
# thead-ppu-runtime/v2/image.baseline.yaml）+ FlagMemory@58e60a9（v0.3.0）pip-editable 挂载。
# 容器参数（网络/hosts/shm/全 16 卡设备/环境变量）逐项沿用 thead-ppu-runtime/v2/env/v1
# 实测骨架；PPU 无带卡容器独占，实际用卡由 CUDA_VISIBLE_DEVICES 授予。
#
# 【两条 PPU 启动坑已内置规避】（同 thead env/v1）：--network host 下宿主主机名
# （ai-server）不在 DNS 须 --add-host；镜像写死 NCCL_SOCKET_IFNAME=eth0 而真网卡是
# bond0 须覆盖。
#
# 用法（仓根执行，机器 = PTG_0 / ai-server）：
#   ppu-smi | tail -24      # 挑空闲卡
#   dev/lib/up.sh dev/memory/cases/tiering-async-ppu/env --strict
#   docker exec -it flagrt-fm-tiering-ppu-ptg0 bash
# 收尾：
#   WORKSPACE_ROOT=$PWD docker compose -f dev/memory/cases/tiering-async-ppu/env/docker-compose.yml down

name: flagrt-fm-tiering-ppu

x-flagrt:
  image_baseline: ../../../../../dev/images/thead-ppu-runtime/v2/image.baseline.yaml
  # FlagMemory 以可编辑方式挂载（镜像不含本组件；pyproject 在仓根）。
  mounted_repos:
    FlagMemory: {activation: pip-editable}

services:
  runtime-ppu:
    container_name: flagrt-fm-tiering-ppu-ptg0
    image: flagrt/thead-ppu-runtime:1.0.0-ppu3.6-py312-torch2.10.0-flagtree0.7.0-triton3.6.0-x86_64
    network_mode: host
    ipc: host
    shm_size: 32g
    tty: true
    stdin_open: true
    devices:
      # 映射全部 16 卡 ⇒ 容器内逻辑号 == 宿主物理号；实际用卡由 CUDA_VISIBLE_DEVICES 授予。
      - /dev/alixpu:/dev/alixpu
      - /dev/alixpu_ctl:/dev/alixpu_ctl
      - /dev/alixpu_ppu0:/dev/alixpu_ppu0
      - /dev/alixpu_ppu1:/dev/alixpu_ppu1
      - /dev/alixpu_ppu2:/dev/alixpu_ppu2
      - /dev/alixpu_ppu3:/dev/alixpu_ppu3
      - /dev/alixpu_ppu4:/dev/alixpu_ppu4
      - /dev/alixpu_ppu5:/dev/alixpu_ppu5
      - /dev/alixpu_ppu6:/dev/alixpu_ppu6
      - /dev/alixpu_ppu7:/dev/alixpu_ppu7
      - /dev/alixpu_ppu8:/dev/alixpu_ppu8
      - /dev/alixpu_ppu9:/dev/alixpu_ppu9
      - /dev/alixpu_ppu10:/dev/alixpu_ppu10
      - /dev/alixpu_ppu11:/dev/alixpu_ppu11
      - /dev/alixpu_ppu12:/dev/alixpu_ppu12
      - /dev/alixpu_ppu13:/dev/alixpu_ppu13
      - /dev/alixpu_ppu14:/dev/alixpu_ppu14
      - /dev/alixpu_ppu15:/dev/alixpu_ppu15
    volumes:
      # 仓根挂载提供 FlagMemory → /workspace/FlagMemory（pip-editable 挂载源）。
      - ${WORKSPACE_ROOT}:/workspace
    environment:
      - DO_NOT_TRACK=1
      - PYTHONDONTWRITEBYTECODE=1
      - GIT_OPTIONAL_LOCKS=0
      # 坑②：镜像写死 eth0，本机真网卡 bond0；不覆盖则 nccl all_reduce 失败
      - NCCL_SOCKET_IFNAME=bond0
    extra_hosts:
      - "ai-server:127.0.0.1"     # 坑①：--network host 下主机名不解析 → torchrun 挂 300s
    working_dir: /workspace
    # 启动即 pip-editable 安装 FlagMemory；失败则容器退出。SDK 环境变量由镜像 ENV 固化。
    command: [bash, -c, 'git config --global --add safe.directory /workspace/FlagMemory && mkdir -p /workspace/evidence && python3 -m pip install --no-deps --no-build-isolation -e /workspace/FlagMemory > /workspace/evidence/flagmemory-build.log 2>&1 && touch /workspace/evidence/flagmemory-build.done && exec sleep infinity']
    restart: "no"

