schema: flagrt.baseline/v1
kind: container
# 手写登记式（非 baseline.py export 产物）：镜像为 FlagRelease 厂商发布线应用镜像，
# 无本仓 Dockerfile 血统可核（ENV-SPEC §4.2 不适用）。镜像事实的权威登记处 =
# FlagMemory 仓 flagmemory/tiering/offload/ppu/RUNBOOK.md §0（定档 2026-11-14，
# digest 锚与容器内栈实测）；本文件 image.id 与本地 docker image inspect 核对。
# mounted_repos 节与 export 产物同形态（check/up.sh --strict 照常核对）。
written_by: 手写（xliu969，2026-11-15）
basis: FM RUNBOOK §0 定档节 + 本地 docker image inspect 实测
compose: docker-compose.yml

image:                       # check 只核对本地镜像 id；digest 为版本主锚（RUNBOOK 同源）
  ref: harbor.baai.ac.cn/flagrelease-public/flagrelease_ppu_vllm024_gems_540:1012
  id: sha256:6cd05dcdcf306fa292b1a9f766e92cdb6654a50a330323d4d672af8ce8108527
  digest: sha256:399937f1d77a0565ffcfae386d6abc0b9f4f16b1546e9ae46f49d7d75355bb03
  baseline: image.anchor.yaml   # 本目录手写登记桩（权威登记处 = FM RUNBOOK §0）

baked_repos:                 # 栈事实抄录自 RUNBOOK §0「核心栈（容器内实测 2026-11-14）」，只读；
                             # 厂商发布线镜像整体由 image id/digest 约束，不与宿主比对
  vllm:
    layer: L3
    from: base_image
    version: 0.24.0+empty
    install: pip (wheel)
    info: 自带 kv_connector factory 外挂面（KVTransferConfig.kv_connector_module_path）
  vllm-plugin-FL:
    layer: L3
    from: base_image
    version: 0.3.0rc2.post3
    install: in-image (/opt/vllm-plugin-FL)
  torch:
    layer: L3
    from: base_image
    version: 2.11.0+v0.1.0.ppu2.1.0.oe
    install: pip (wheel)
    info: 复用 torch.cuda 命名空间
  triton:
    layer: L3
    from: base_image
    version: 3.5.0+gitcc5446cf
    install: pip (wheel)
  flag_gems:
    layer: L3
    from: base_image
    version: 5.4.0+g0d95c2092
    install: pip (wheel)
  ppu_sdk:
    layer: L1
    from: base_image
    version: v2.1.0
    install: in-image (/usr/local/PPU_SDK)
    info: CUDA wrapper cu130；SDK 环境变量不固化，须 source envsetup.sh + UMD/HGGC（RUNBOOK 三件套）

# ────────────────────────────── 环境挂载（env） ──────────────────────────────
mounted_repos:               # check 与 load 的对象
  FlagMemory:
    host_path: FlagMemory
    remote: git@github.com:FlagRT/FlagMemory.git
    container_path: /workspace/FlagMemory
    activation: pip-editable
    commit: 58e60a94929e8920166fe634b1709290fef1bf4f
    dirty: false
    pushed: true
    info: {branch: 'main, dev-1.0', committed_at: '2026-11-14 22:33:45 +0800'}
# changelog:
# 2026-11-15  首版（export 产物改锚重写为手写登记式）：镜像 thead-ppu-runtime v2 →
#             flagrelease vllm0.24 定档镜像（FM RUNBOOK §0；v2 内 FM offload/ppu
#             import 链断为已登记环境边界）；mounted_repos 不变（FlagMemory@58e60a9）。
