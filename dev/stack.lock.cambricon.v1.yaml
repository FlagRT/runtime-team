# =====================================================================
# 运行时层 · 寒武纪 MLU590 统一基座 —— 锁定镜像与基座规范（首次建立）
# 文件：dev/stack.lock.cambricon.v1.yaml
# 效力：本文件是全组（寒武纪 MLU590 线）结论性验证的唯一环境依据；任何变更需更新本文件并知会全组
# 起草：runtime-team 总组 ｜ 结构参照 dev/stack.lock.thead-ppu.v1.yaml，内容按寒武纪实情如实分叉
# 记录：2026-10-15 ｜ 定稿：2026-10-15 ｜ 状态：生效
# 版本化规范见战略文档 §8（影响已锁定承诺的变更 → 新建版本号文件，旧文件开头加 LEGACY 说明）
#
# 本文件为寒武纪 MLU590 首份锁定声明：此前该芯片无 stack.lock 文件。发布物 = cambricon-mlu-runtime v1
# （FlagOS 官方运行时基座镜像，登记式基线 ADR-0007，repro_status 🟢）+ cambricon-infer-vllm v1
# （FlagOS 官方推理应用镜像，2026-10-24 验收入锁，两腿各管一：训练/设备上下文=基座、推理服务化=infer）。
# 与 PPU / 昆仑芯的类似点：无带卡容器独占（多容器可并存）。寒武纪独有的两条：
#   ① 可用镜像档位由宿主驱动版本决定（见 device_registration.selection）——这是选型第一判据，
#      不是「取最新线」；
#   ② 无 FlagTree 线（BAAI·FlagTree 官方手册无寒武纪条目），镜像内 triton 为厂商 triton-mlu 变体。
# =====================================================================

version: 1
recorded_at: "2026-10-15"
updated_at: "2026-10-24"
owner: 总组
chip: "寒武纪 MLU590（MLU590-M9）"
acceptance_model: "Qwen/Qwen3-Embedding-0.6B（与 P800 / PPU 同款基准模型）"
flagtree_line: |
  无 FlagTree 线。寒武纪走 FlagOS 官方运行时线 cambricon-neuware4.4.3
  （py3.10 / torch 2.7.1+cpu / torch_mlu 1.29.2 / triton 3.2.0+mlu1.7.2 / flag_gems 5.4.0rc2.post3）。
  锁定镜像为 FlagOS 官方构建物（harbor.baai.ac.cn/flagos-runtime，上游配方 flagos-ai/build-infra），
  非本组构建、无仓内配方，版本锚 = Harbor digest（公开匿名可拉）。镜像内 triton 是厂商 triton-mlu
  变体，不是 FlagTree 构建物 —— 勿按昇腾/昆仑芯的 flagtree 线号理解。
  本组 cambricon 后端不在镜像内，在仓内 dev/device-context/prototype/runtime/，
  经 WORKSPACE_ROOT 挂载使用。版本事实（image id、内置组件版本）以
  dev/images/cambricon-mlu-runtime/v1/image.baseline.yaml 为准。

# ---------------------------------------------------------------
# 设备注册路线（寒武纪实情；独占纪律同 P800 / PPU，与昇腾相反，勿照抄昇腾）
# ---------------------------------------------------------------
device_registration:
  primary: "Route A（厂商官方栈：FlagOS 官方镜像自带 NEUWARE 4.4.3 + torch_mlu 1.29.2；PyTorch PrivateUse1 扩展，device_type=mlu，设备 API 走 torch.mlu 命名空间；集合通信后端 cncl）"
  selection: |
    【档位由宿主驱动决定 —— 本芯片选型第一判据】FlagOS 寒武纪镜像按 NEUWARE 档位分线，
    各档官方标注宿主驱动前置：neuware4.4.3 → 6.2.15；neuware4.7.2 → 6.5.48。
    实测宿主驱动 v6.2.29（6.2.x 线）⇒ 取 neuware4.4.3 档。升驱动以切 4.7.2 档属预案，
    不是当前诉求：这些机器为多人共享的 k8s 在册节点，动驱动会打断在跑负载。
    【独占与选卡】无带卡容器独占（同 P800 / PPU，与昇腾相反）：多容器可并存，
    docker ps 只是共享机礼貌；用 cnmon 挑 0% 利用率 / 0 MiB 显存的空闲卡，以
    MLU_VISIBLE_DEVICES=<卡号> 自律（demo 映射全部 8 卡使容器内逻辑号 == 宿主物理号；
    自建环境只授予卡子集时须写重编号后的逻辑号——该变量按授予顺序密集重编号）。
    【设备授予】寒武纪无容器 toolkit（不像昇腾 Ascend-docker-runtime）⇒ 不用 --runtime、
    不需要 --privileged；声明式 devices 授 /dev/cambricon_ctl（缺它设备枚举失效）
    + /dev/cambricon_gdr + cambricon_dev0..7 + cambricon_ipcm0..7，共 18 个节点；
    另需 --cap-add=SYS_PTRACE 与 --security-opt seccomp=unconfined。
    【宿主无 neuware】宿主只装驱动，无 /usr/local/neuware ⇒ 一切验证在带卡容器内做；
    cnmon 是宿主工具，须挂 -v /usr/bin/cnmon:/usr/bin/cnmon:ro 才能在容器内查卡。

# ---------------------------------------------------------------
# 锁定镜像（FlagOS 官方运行时基座）
# ---------------------------------------------------------------
lock:
  runtime:
    image: "harbor.baai.ac.cn/flagos-runtime/flagos-runtime-cambricon-neuware4.4.3:2.2.0"
    notes: "FlagOS 官方运行时基座镜像（登记式基线，ADR-0007）：设备上下文与训练路径同底座。本镜像不含 vLLM，推理服务化用推理腿 cambricon-infer-vllm v1（见下方 lock.infer）。版本事实以 dev/images/cambricon-mlu-runtime/v1/image.baseline.yaml 为准"
    container_name: "flagrt-mlu-v1-demo-mlu2（demo 运行环境容器：dev/images/cambricon-mlu-runtime/v1/demo/）"
    base_image_entry: "dev/images/cambricon-mlu-runtime/v1"
    registry_status: "公开 Harbor registry（harbor.baai.ac.cn/flagos-runtime），匿名可按 digest 拉取（2026-10-15 实测）。digest：sha256:e55b420ee98e0fdef6c18a27b633d67b988ecef81a52a0fef5a0c6636c91d5c2｜image id：sha256:e887e0ca4333a27185817fb8fef6ce95d5d9220c5a9725641187d602cabeea96（本机 docker inspect 实测）｜repro_status 🟢 FlagOS 官方镜像（镜像不可重建是设计边界，官方产物）"

  infer:
    image: "harbor.baai.ac.cn/flagos-app/vllm0.20.2-cambricon-neuware4.4.3:2.2.0-0.2.2"
    notes: "推理腿发布物（FlagOS 官方 vLLM 应用镜像，登记式基线 ADR-0007）：vllm 0.20.2+flagos / vllm-plugin-FL 0.2.2（寒武纪线必需组件，勿套用 910C 的 unset VLLM_PLUGINS）/ neuware4.4.3 栈。服务化走 serve_standard.sh（DC_BACKEND=cambricon，embed 形态）。版本事实与启动纪律以 dev/images/cambricon-infer-vllm/v1 为准"
    container_name: "flagrt-mlu-infer-v1-demo-mlu2（demo 运行环境容器：dev/images/cambricon-infer-vllm/v1/demo/）"
    base_image_entry: "dev/images/cambricon-infer-vllm/v1"
    registry_status: "公开 Harbor registry（harbor.baai.ac.cn/flagos-app），匿名可按 digest 拉取（2026-10-24 拉取实测 RepoDigest 逐字一致）。digest：sha256:76a673a8b4aaa9d6b7752b678ec1fcbb5f6bcfc711414b809117a5b8077b9e94｜image id：sha256:4f298aa57807e13c02ee179385cfe07e97db4613470bc72d428d02d65e6273fe（HWJ_1 docker inspect 实测）｜repro_status 🟢 FlagOS 官方镜像。入锁依据 = serve_standard.sh 口径验收 PASS（2026-10-24 HWJ_1：SERVE_STANDARD_PASS ready=1 smoke=1；Qwen3-Embedding-0.6B、dev0、TP=1、eager、init engine 149.5s，验收后 8 卡释放 0 MiB）"
# ---------------------------------------------------------------
# 使用规则（按寒武纪实情；寒武纪特有纪律置于最前）
# ---------------------------------------------------------------
rules:
  - "选镜像档位先看宿主驱动：6.2.x 线 → neuware4.4.3 档；6.5.x 线 → neuware4.7.2 档。跨档使用属未验证组合"
  - "import triton 必须先 import torch_mlu（否则报 Failed to load the backend extension: mlu，文案像设备问题、实为导入顺序）；不要用 TORCH_DEVICE_BACKEND_AUTOLOAD=0 绕过"
  - "容器内执行一律经 shell（docker exec … bash -lc 包裹）：/opt/triton 只在经 shell 启动时进 PYTHONPATH（镜像 BASH_ENV=/etc/bash_env.sh），python3 直调看不到 triton"
  - "起容器必须授予 18 个设备节点并挂 /usr/bin/cnmon:ro（宿主无 neuware，不挂则容器内无法查卡）"
  - "选卡变量是 MLU_VISIBLE_DEVICES（不是 CUDA_VISIBLE_DEVICES / ASCEND_RT_VISIBLE_DEVICES）"
  - "结论性验证只在锁定镜像内做；日常调试容器结果不作为验收依据"
  - "任何镜像变更必须更新本文件并知会全组"
  - |
    共享机纪律（寒武纪 MLU590 节点，同 P800 / PPU 型）：无带卡容器独占，但绝不 stop/rm/exec
    他人容器；用卡前 cnmon 挑空闲卡。这些机器同时是 k8s 在册节点（kubelet + cambricon
    device-plugin 在运行），集群侧可能调度 pod 占卡 —— 长时间占卡前先确认卡况并知会。
    镜像与大文件落 /srv（11T），勿写系统盘。
  - |
    基座镜像入锁门槛（沿用既有口径）：任何镜像进入本文件 lock: 前，
    dev/images/<name>/v<N>/ 必须存在且含 lock.yaml，repro_status ≥ 🟡；
    上游发布的镜像可无 Dockerfile 但须有可拉取 digest。规范见 dev/images/README.md。
    统一基座的确定/调整/发布由总组裁定；各方向只消费不自建，诉求写进本方向
    STATUS.md 由总组收拢。

# ---------------------------------------------------------------
# 已知限制（各带删除条件）
# ---------------------------------------------------------------
known_issues:
  - id: C-2
    what: "硬件能力 torch.mlu.get_device_capability() 返回 (5, 0)（MLU590-M9 实测）⇒ FP8 与 MX 量化不可用"
    detail: "厂商 vLLM 手册标注 FP8 需 >= (6, 0)、MX 类型需 >= (6, 1)；本卡型两者均不满足。可用量化路径限 SmoothQuant 等"
    workaround: "无（硬件代际约束）；量化方案避开 FP8 / MX"
    removal_condition: "更换到 capability >= (6, 0) 的卡型（如 MLU690）⇒ 本条对该卡型不适用"
  - id: C-3
    what: "import triton 必须先 import torch_mlu，否则 triton 内部 import torch 触发设备后端自动加载失败（RuntimeError: Failed to load the backend extension: mlu）"
    detail: "确定性复现（device-context 2026-09-22 实测 3/3；总组 2026-10-15 在本芯片复核）。报错文案像设备问题、实为导入顺序问题。另：/opt/triton 只在经 shell 启动时进 PYTHONPATH，python3 直调看不到 triton"
    workaround: "先 import torch_mlu 再 import triton；容器内执行一律经 bash -lc。不要用 TORCH_DEVICE_BACKEND_AUTOLOAD=0（会一并影响 mlu 后端注册）"
    removal_condition: "上游 triton-mlu 变体修正导入期副作用，或 torch_mlu 改为显式注册 ⇒ 本条删除"
  - id: C-4
    what: "CNCL 走 MLU_LINK 片间互联，运行期未加载 libibverbs / libmlx5 ⇒ RDMA 传输未启用，集合通信结论只覆盖单机多卡"
    detail: "训练腿日志可见 CNCL 对两库的加载告警；归因（环境不提供 vs 容器未配置）待实测，核查脚本由 device-context 方向维护"
    workaround: "跨机集合通信不在现行结论覆盖范围内；单机多卡路径不受影响"
    removal_condition: "完成 RDMA 归因实测并给出可用配置（或确认平台不提供）⇒ 本条按结论改写或删除"
  - id: C-5
    what: "torch_mlu 的 torch.mlu.Stream(priority=…) 对区间 (0, -3) 之外的取值静默接受、不报错"
    detail: "上游参数校验缺失（厂商 PyTorch 插件）；表现为非法优先级不抛异常，消费方若不自检会得到非预期的流优先级"
    workaround: "消费方按 stream_priority_range() 自行校验取值域并回读校验（device-context 适配层已在统一面兜住）"
    removal_condition: "torch_mlu 上游补参数区间校验 ⇒ 本条删除"

