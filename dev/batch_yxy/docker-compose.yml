# Batch（batch_yxy）子方向开发容器（公共资源配置见 ../compose.base.yml，本文件只含子方向专属）
# 用法：cd dev/batch_yxy && docker compose --env-file .env -f ../compose.base.yml -f docker-compose.yml up -d runtime-dev
# 注意：-f 多文件合并（后文件覆盖前文件），需 docker compose v2；DrvMng 并发容器上限≈3；
#       多卡测试前 npu-smi 确认 16 卡空闲；容器名冲突时先 docker stop 旧容器

# 独立 project，避免公共 service 名 runtime-dev 与其他子方向冲突。
name: flagos-batch-yxy

services:
  runtime-dev:
    # vLLM 组批（batching）策略改造：切到华为昇腾官方 vllm-ascend 镜像（vLLM 0.20.2）。
    # 覆盖公共 compose.base.yml 的 CANN 底座；血统/版本见 dev/images/ascend-infer-vllm/v1/lock.yaml。
    image: quay.io/ascend/vllm-ascend:v0.20.2rc1-a3
    container_name: flagos-batch-yxy-dev-910c
    # harbor 镜像 entrypoint 是 exec "$@"，无命令会立即退出（exit 0）；用 sleep 保活（等价 hostnet 重建镜像的 CMD 行为）
    command: ["sleep", "infinity"]
    # 单卡开发：!override 整值替换 base 的 16 卡 devices。
    # compose 对 devices 是追加合并，不整值替换会保留全部 davinci；!reset 会把序列清空，
    # 必须用 !override（需 compose ≥2.24）。davinci0 = npu-smi NPU0/chip0（当前空闲）。
    devices: !override
      - /dev/davinci0:/dev/davinci0
      - /dev/davinci_manager:/dev/davinci_manager
      - /dev/devmm_svm:/dev/devmm_svm
      - /dev/hisi_hdc:/dev/hisi_hdc
      # OEM 定制节点：本机 npu-smi 查 board type 依赖（缺了报 -9005）
      - /dev/lqdcmi_pcidev:/dev/lqdcmi_pcidev
    environment:
      # 单卡：容器内只有 davinci0，固定可见设备为 0
      - ASCEND_RT_VISIBLE_DEVICES=${ASCEND_RT_VISIBLE_DEVICES:-0}
      # 子方向专属环境变量（与 .env.example 对应，.env 中可覆盖默认值）
      # - BATCH_SWITCH=${BATCH_SWITCH:-true}
    volumes:
      # 容器内 git 复用宿主 SSH key（只读挂载；不挂 config/整目录——root 读 uid≠0 的 config 会报 Bad owner）
      - ${HOME}/.ssh/id_rsa:/root/.ssh/id_rsa:ro
      - ${HOME}/.ssh/id_rsa.pub:/root/.ssh/id_rsa.pub:ro
      - ${HOME}/.ssh/known_hosts:/root/.ssh/known_hosts:ro
      # npu-smi 及其依赖（镜像内没有；照抄本机 flagperf 容器的挂载集，均只读）
      - /usr/local/bin/npu-smi:/usr/local/bin/npu-smi:ro
      - /usr/local/dcmi:/usr/local/dcmi:ro
      - /usr/local/Ascend/firmware:/usr/local/Ascend/firmware:ro
      - /etc/ascend_install.info:/etc/ascend_install.info:ro
      # 共享模型权重（只读）：含 Qwen3-Embedding-0.6B 等，路径容器内外保持一致
      - /mnt/raid/hliu553/models:/mnt/raid/hliu553/models:ro
      # opencode 状态持久化（auth/API key、会话；.opencode/ 已 ignore）。
      # 注意：compose 相对路径按首个 -f 文件（../compose.base.yml，位于 dev/）解析
      - ./batch_yxy/.opencode/config:/root/.config/opencode
      - ./batch_yxy/.opencode/data:/root/.local/share/opencode
      # vLLM/vllm-ascend editable 源码持久化（改动不入仓，见 .gitignore；正式补丁同步到自己的 fork）
      - ./batch_yxy/vllm:/vllm-workspace/vllm
      - ./batch_yxy/vllm-ascend:/vllm-workspace/vllm-ascend
    restart: "no"
    # 注意：容器内实验 venv 不在挂载盘上，容器重建会丢失；重建步骤见 scripts/setup_env.sh
