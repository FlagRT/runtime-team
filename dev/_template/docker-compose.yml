# __NAME_CN__（__NAME__）子方向开发容器（本文件只含子方向专属，公共资源配置见下方叠加的
# 芯片/版本层）
# 用法（校验版本 + 启动，见 dev/ENV-SPEC.md）：先选一个芯片+版本层作为基础
#   dev/lib/up.sh dev/images/<chip>/v<N>/docker-compose.<tag>.yml \
#                 dev/__NAME__/docker-compose.yml
# 完整可跑通的例子见 dev/_template/USAGE-DEMO.md。
# 注意：-f 多文件合并（后文件覆盖前文件），需 docker compose v2；DrvMng 并发容器上限≈3；
#       多卡测试前 npu-smi 确认 16 卡空闲；容器名冲突时先 docker stop 旧容器

# 每个子方向必须使用独立 project，避免公共 service 名 runtime-dev 发生跨方向重建。
name: flagos-__NAME__

services:
  runtime-dev:
    container_name: flagos-__NAME__-dev-910c
    environment:
      # 子方向专属环境变量（与 .env.example 对应，.env 中可覆盖默认值）
      # - YOUR_SWITCH=${YOUR_SWITCH:-true}
    restart: "no"
    # 注意：容器内实验 venv 不在挂载盘上，容器重建会丢失；重建步骤记入本子方向 README
