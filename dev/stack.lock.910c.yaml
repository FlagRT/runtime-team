  infer:                                # 推理腿：单卡推理服务
    image: "quay.io/ascend/vllm-ascend:v0.20.2rc1-a3"
    notes: "推理框架 0.20.2 官方自带"
    container_name: "flagos-proto-infer-910c"

# ---------------------------------------------------------------
# 基座组件（设备上下文已交付，全组下游使用）
# ---------------------------------------------------------------
runtime:
  component: "统一运行时 API + Backend 注册表 + 昇腾后端"
  version: "0.1.0"
  location: "dev/device-context/runtime/"
  entry: "runtime.use(\"ascend\") 一行接入；接口见 docs/INTERFACE_CONTRACT_DC_20260908.md"
  conformance_baseline: "13/13 + 6/6（910C 真机）"
  feedback: "问题反馈 device-context，按周迭代组件版本"

# ---------------------------------------------------------------
# 使用规则
# ---------------------------------------------------------------
# ---------------------------------------------------------------
# 使用规则（第 1 条为最高优先级，实测取证，出现事故先查它）
# ---------------------------------------------------------------
rules:
  - |
    【最高优先级】带卡容器并发上限 3：同一时刻最多 3 个挂载 NPU 设备的容器同时运行。
    超限后新容器内 acl.init() 返回 500000（ACL_ERROR_INTERNAL_ERROR），
    伴随 DrvMngGetConsoleLogLevel failed(ret=4) / path string is NULL，
    表现为 torch.npu.device_count()=0、设备"凭空消失"。
    → 出现 500000 / 设备不可见，第一时间核查并发容器数（docker ps 数带卡容器），
      不要先怀疑镜像、驱动或代码。
    → 两条腿（训练/推理）不需要同时跑：串行执行即可，跑完一条停掉再起下一条。
  - "结论性验证只在锁定镜像内做；日常调试容器结果不作为验收依据"
  - "任何镜像变更必须更新本文件并知会全组"
  - |
    【镜像获取现状（2026-09-09 实测）】锁定镜像在 registry 上**不可公开拉取**
    （docker manifest inspect 两个镜像均查询失败；本地镜像 RepoDigests 为空 =
    经 docker save/load 离线导入，非 docker pull）。下游复现时请向镜像负责方索取
    离线包（docker save），或待其推送到可访问 registry 后更新本文件。
    注意区分镜像族：flagrt/ascend-operator-runtime（无 -comm）与
    flagrt/ascend-operator-runtime-comm（含 flagcx）是两个不同仓库，
    本文件锁定的是后者（comm:0.1.3），勿混用。

  - "起容器前自查：并发容器数 ≤3、镜像与本文件一致、容器名符合规范、卡资源空闲"
  - "合入把关五条：镜像与 stack.lock 一致 ｜ 容器/分支命名合规 ｜ 接口约定章节完稿且下游确认 ｜ 能跑自己那段 demo ｜ 无环境分叉"

# ---------------------------------------------------------------
# 两条腿的运行方式约束（实测）
# ---------------------------------------------------------------
per_leg:
  train:
    device_backend: "npu（torch_npu）"
    note: |
      **2026-09-22 口径统一（本次变更）**：全组统一基座定的是 Qwen3-0.6B **训推**，且原型接入走
      **厂商 torch 插件路线** ⇒ 训练腿由 `flagos`(torch_fl) 切到 `npu`(torch_npu)，
      **原「权宜例外」正式取消**（原例外的唯一成因是锁定训练镜像"禁止 torch_npu 与 Torch-FL 共存"）。

      调用方式（实测可用）：
        · 解释器：带 torch_npu 的那个 —— 容器内 `/mnt/raid/hliu553/venvs/venv-infer-a/bin/python`
          （该解释器内**没有 torch_fl**，两者**物理隔离**，故不会触发镜像的共存校验）；
        · 环境：`DC_BACKEND=ascend DC_DIST_BT=hccl`，选卡 `ASCEND_RT_VISIBLE_DEVICES`；
        · ⚠️ **集合通信后端名必须显式给 `hccl`**（脚本已内置默认），且 `init_process_group` **之前**
          必须先经后端触碰一次设备（`runtime.use()` + `device_count()`）——否则 `hccl` 未注册，
          报 `AssertionError: Unknown backend type hccl`（2026-09-22 实测踩到，审计台账第 15 条）。

      实测证据（2026-09-22，2 卡 / 50 步 / Qwen3-Embedding-0.6B）：
        `TRAIN_LEG_PASS 6/6`；loss **15.4498 → 11.1479**（torch_fl 线同为 50 步 **15.4497 → 11.1515**，
        曲线几乎重合 —— 0.03% 的差属集合通信归约顺序差异引入的浮点非确定性，**不是逻辑差异**）；
        吞吐 **3954–4402 tok/s**（两卡合计；**同模型同步数**下 torch_fl 线为 **2212.9** ⇒ **+79~99%**）。
        `910C/probes/train_npu_20260922.log`、`910C/probes/unified_verify_20260922.log`

      ⚠️ 原 torch_fl 线的 `TORCH_DEVICE_BACKEND_AUTOLOAD=0` + `先 import torch_fl 再 import torch`
         **仅在仍使用 `flagos` 后端时才需要**；`flagos` 后端保留可用（备用/历史复现），不再是训练腿默认路径。
    python: "/mnt/raid/hliu553/venvs/venv-infer-a/bin/python"
  infer:
    device_backend: "npu（torch_npu）"
    note: "镜像自带 torch_npu，我们的原型通过 runtime/backends/ascend 后端接入"
  concurrency: "两条腿串行；确需并行时须确保带卡容器总数 ≤3"

